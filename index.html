<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#060d1f" />
<title>Stack to Orbit</title>
<style>
  :root {
    --ink: #f8fafc;
    --muted: rgba(226, 232, 240, 0.74);
    --dim: rgba(226, 232, 240, 0.5);
    --panel: rgba(10, 18, 38, 0.74);
    --panel-2: rgba(30, 41, 70, 0.78);
    --line: rgba(255, 255, 255, 0.1);
    --line-2: rgba(255, 255, 255, 0.18);
    --accent: #facc15;
    --accent-ink: #1c1300;
    --accent-deep: #a16207;
    --good: #34d399;
    --danger: #f87171;
    --radius: 20px;
    --radius-s: 14px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%; overflow: hidden; background: #060d1f; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  svg { width: 1em; height: 1em; display: block; flex: none; }
  .ic { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 0; left: 0; right: 0; padding-top: calc(var(--safe-t) + 18px); text-align: center; pointer-events: none; transition: opacity .2s; }
  #hud.hidden { opacity: 0; }
  #score {
    display: inline-block; font-size: 58px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 0 rgba(0,0,0,.25), 0 6px 18px rgba(0,0,0,.35);
  }
  #score.pop  { animation: pop .18s ease-out; }
  #score.pop2 { animation: pop2 .26s ease-out; }
  @keyframes pop  { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  @keyframes pop2 { 0% { transform: scale(1); } 35% { transform: scale(1.3); }  100% { transform: scale(1); } }
  #info { font-size: 15px; font-weight: 600; color: var(--muted); min-height: 18px; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  #msg {
    font-size: 20px; font-weight: 800; color: #fde047; height: 32px; margin-top: 6px;
    opacity: 0; transition: opacity .25s; text-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  #msg.show { opacity: 1; }
  #msg span { display: inline-block; }
  #msg span.info { animation: msgIn .3s cubic-bezier(.2, 1.6, .4, 1); }
  #msg span.combo { animation: comboIn 1s ease-out forwards; }
  @keyframes comboIn {
    0%   { transform: translateY(8px) scale(.5); opacity: 0; }
    14%  { transform: translateY(0) scale(var(--peak, 1.1)); opacity: 1; }
    28%  { transform: translateY(-2px) scale(1); opacity: 1; }
    72%  { opacity: 1; }
    100% { transform: translateY(-16px) scale(1); opacity: 0; }
  }
  @keyframes msgIn { from { transform: scale(.55) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  #zone {
    position: fixed; left: 50%; top: calc(var(--safe-t) + 128px); transform: translate(-50%, -6px);
    padding: 7px 14px; border-radius: 999px; background: rgba(8, 14, 32, 0.55); border: 1px solid var(--line);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: baseline; gap: 8px; white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity .35s, transform .35s;
  }
  #zone.on { opacity: 1; transform: translate(-50%, 0); }
  #zone b { font-size: 14px; }
  #zone small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #pauseBtn { position: fixed; top: calc(var(--safe-t) + 14px); right: 14px; display: none; }
  #pauseBtn.show { display: flex; }

  /* ---------- Buttons ---------- */
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  button:disabled { cursor: default; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    min-height: 52px; padding: 12px 20px; border-radius: 16px; font-size: 17px; font-weight: 750;
    background: var(--panel-2); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.28);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .btn svg { font-size: 20px; }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 5px 0 var(--accent-deep); }
  .btn-primary:active:not(:disabled) { box-shadow: 0 2px 0 var(--accent-deep); }
  .btn-xl { min-height: 64px; font-size: 20px; border-radius: 20px; }
  .btn-xl svg { font-size: 26px; }
  .btn .stack { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
  .btn .stack small { font-size: 12.5px; font-weight: 650; opacity: .72; }
  .btn-danger { color: #fecaca; }
  .ib {
    width: 46px; height: 46px; border-radius: 15px; display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--line); font-size: 21px; flex: none;
    box-shadow: 0 3px 0 rgba(0,0,0,.25); transition: transform .08s;
  }
  .ib:active:not(:disabled) { transform: translateY(2px); }
  .ib:disabled { opacity: .35; }
  .ib.sm { width: 38px; height: 38px; border-radius: 12px; font-size: 18px; }
  .ib.off { opacity: .45; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums;
  }
  .chip svg { color: var(--accent); font-size: 16px; }
  .chip i { font-style: normal; color: var(--dim); font-weight: 600; }

  /* ---------- Screens ---------- */
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 18px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    opacity: 0; visibility: hidden; transform: translateY(10px); pointer-events: none;
    transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
  }
  .screen.on { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }
  .screen.dim { background: rgba(4, 9, 22, 0.66); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px); }
  .wrap { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .hdr { display: flex; align-items: center; gap: 12px; min-height: 48px; }
  .hdr h2 { flex: 1; font-size: 22px; font-weight: 800; letter-spacing: .2px; }
  .grow { flex: 1; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .note { font-size: 13px; color: var(--dim); text-align: center; line-height: 1.45; padding: 4px 8px; }

  /* Menu */
  #scr-menu { background: linear-gradient(rgba(4,9,22,.55), rgba(4,9,22,0) 26%, rgba(4,9,22,0) 52%, rgba(4,9,22,.72)); }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .logo { text-align: center; margin-top: 4vh; }
  .logo-blocks { display: flex; flex-direction: column; align-items: center; gap: 3px; margin-bottom: 12px; }
  .logo-blocks i { display: block; height: 11px; border-radius: 3px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .logo-blocks i:nth-child(1) { width: 44px; background: linear-gradient(#fde68a 0 35%, #facc15 35%); transform: translateX(6px); }
  .logo-blocks i:nth-child(2) { width: 52px; background: linear-gradient(#c4b5fd 0 35%, #8b5cf6 35%); }
  .logo-blocks i:nth-child(3) { width: 60px; background: linear-gradient(#7dd3fc 0 35%, #38bdf8 35%); }
  .logo h1 { font-size: 46px; font-weight: 900; line-height: .95; letter-spacing: 2px; text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.4); }
  .logo h1 span { display: block; font-size: 22px; letter-spacing: 11px; margin-top: 6px; color: var(--accent); padding-left: 11px; }
  .loc { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; }
  .loc-name { min-width: 150px; text-align: center; line-height: 1.15; }
  .loc-name small { display: block; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--dim); font-weight: 700; }
  .loc-name b { font-size: 17px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .mode {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 6px 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: transform .08s;
  }
  .mode:active { transform: translateY(3px); }
  .mode svg { font-size: 26px; color: var(--accent); margin-bottom: 2px; }
  .mode b { font-size: 15px; }
  .mode small { font-size: 11.5px; color: var(--dim); font-weight: 600; text-align: center; }
  .mode.locked svg { color: var(--dim); }
  .mode.locked b { color: var(--muted); }
  .bottomrow { display: flex; gap: 10px; }
  .pillbtn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); font-size: 14.5px; font-weight: 700; position: relative;
  }
  .pillbtn svg { font-size: 19px; }
  .dot { position: absolute; top: 8px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(250,204,21,.25); }

  /* Worlds */
  .worlds { display: flex; flex-direction: column; gap: 12px; }
  .world {
    display: flex; align-items: center; gap: 14px; padding: 12px; text-align: left; width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 0 rgba(0,0,0,.25);
    transition: transform .08s;
  }
  .world:active { transform: translateY(3px); }
  .thumb { width: 86px; height: 64px; border-radius: 14px; overflow: hidden; flex: none; position: relative; background: linear-gradient(var(--a), var(--b)); }
  .thumb svg { width: 100%; height: 100%; position: absolute; inset: 0; }
  .world.locked .thumb { filter: grayscale(.85) brightness(.6); }
  .wtxt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .wtxt b { font-size: 17px; }
  .wtxt small { font-size: 12.5px; color: var(--dim); }
  .bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
  .wmeta { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-top: 2px; }
  .wmeta svg { color: var(--accent); }
  .world.locked .wmeta svg { color: var(--dim); }
  .world > svg.ic { font-size: 22px; color: var(--dim); }

  /* Levels */
  .lvls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .lvl {
    aspect-ratio: 1 / 1.05; border-radius: 18px; background: var(--panel); border: 1px solid var(--line);
    box-shadow: 0 4px 0 rgba(0,0,0,.28); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    transition: transform .08s;
  }
  .lvl:active:not(.locked) { transform: translateY(3px); }
  .lvl .n { font-size: 28px; font-weight: 850; line-height: 1; }
  .lvl .st { display: flex; gap: 2px; font-size: 14px; color: var(--accent); }
  .lvl .st .e { color: rgba(255,255,255,.18); }
  .lvl .tw { font-size: 11px; color: var(--dim); font-weight: 650; }
  .lvl.locked { opacity: .55; }
  .lvl.locked svg.ic { font-size: 26px; color: var(--dim); }
  .lvl.next { border-color: rgba(250,204,21,.6); box-shadow: 0 4px 0 rgba(0,0,0,.28), 0 0 0 3px rgba(250,204,21,.14); }
  .whead { display: flex; align-items: center; gap: 14px; padding: 12px; }

  /* Skins */
  .skins { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .skin {
    display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 10px 12px; border-radius: 18px;
    background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 0 rgba(0,0,0,.25); text-align: center;
  }
  .skin canvas { width: 120px; height: 84px; }
  .skin b { font-size: 15px; }
  .skin small { font-size: 11.5px; color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 4px; line-height: 1.3; }
  .skin.eq { border-color: rgba(250,204,21,.7); }
  .skin.eq small { color: var(--accent); }
  .skin.locked canvas { filter: grayscale(.9) brightness(.55); }

  /* Settings */
  .group { display: flex; flex-direction: column; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 14px; min-height: 64px; text-align: left; width: 100%; }
  .row + .row { border-top: 1px solid var(--line); }
  .row > svg { font-size: 22px; color: var(--muted); }
  .row .lbl { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .row .lbl b { font-size: 15.5px; }
  .row .lbl small { font-size: 12.5px; color: var(--dim); }
  .switch { width: 52px; height: 30px; border-radius: 99px; background: rgba(255,255,255,.16); position: relative; flex: none; transition: background .18s; }
  .switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); transition: transform .18s; }
  .switch[aria-checked="true"] { background: var(--good); }
  .switch[aria-checked="true"] i { transform: translateX(22px); }
  .switch:disabled { opacity: .4; }
  .row.danger b, .row.danger > svg { color: var(--danger); }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .stat { padding: 14px; display: flex; flex-direction: column; gap: 4px; }
  .stat small { font-size: 12px; color: var(--dim); font-weight: 650; text-transform: uppercase; letter-spacing: .8px; }
  .stat b { font-size: 24px; font-weight: 850; font-variant-numeric: tabular-nums; }

  /* How to play */
  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step { display: flex; gap: 14px; align-items: center; padding: 14px; }
  .step .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-weight: 850; flex: none; }
  .step p { font-size: 14.5px; line-height: 1.45; color: var(--muted); }
  .step p b { color: var(--ink); }
  .demo { position: relative; height: 92px; margin: 4px auto 0; width: 220px; }
  .d-base, .d-move { position: absolute; height: 18px; border-radius: 4px; }
  .d-base { top: 46px; left: 50px; width: 120px; background: linear-gradient(#7dd3fc 0 30%, #38bdf8 30% 100%); }
  .d-move { top: 28px; left: 0; width: 120px; background: linear-gradient(#fde68a 0 30%, #facc15 30% 100%); animation: slide 1.6s ease-in-out infinite alternate; }
  @keyframes slide { from { left: 0; } to { left: 100px; } }
  .d-tap { position: absolute; top: 4px; right: 18px; font-size: 26px; animation: tap 1.1s ease-in-out infinite; }
  @keyframes tap { 0%, 100% { transform: scale(1); } 50% { transform: scale(.82); } }

  /* Pause + result */
  .center { margin: auto 0; display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .ttl { font-size: 34px; font-weight: 850; text-align: center; line-height: 1.1; }
  .sub { font-size: 15px; color: var(--muted); text-align: center; }
  .quick { display: flex; justify-content: center; gap: 12px; margin-top: 4px; }
  .bigscore { font-size: 72px; font-weight: 900; text-align: center; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 6px 24px rgba(0,0,0,.4); }
  .badge { align-self: center; padding: 5px 12px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 850; letter-spacing: .6px; }
  .rstars { display: flex; justify-content: center; gap: 10px; font-size: 54px; color: rgba(255,255,255,.16); margin: 4px 0; }
  .rstars .on { color: var(--accent); animation: starIn .45s cubic-bezier(.2, 1.7, .4, 1) both; filter: drop-shadow(0 0 14px rgba(250,204,21,.45)); }
  .rstars .on:nth-child(2) { animation-delay: .18s; }
  .rstars .on:nth-child(3) { animation-delay: .36s; }
  @keyframes starIn { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .notes { display: flex; flex-direction: column; gap: 8px; }
  .notes div { padding: 10px 12px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; font-weight: 650; text-align: center; }
  .notes div.hi { border-color: rgba(250,204,21,.55); color: #fef3c7; }
  .rrow { display: flex; gap: 10px; }
  .rrow .btn { flex: 1; }
  .prog2 { height: 10px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin: 4px 24px; }
  .prog2 i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

  /* Modal */
  .modal { align-items: center; justify-content: center; z-index: 30; }
  .mcard { width: 100%; max-width: 360px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .mcard h3 { font-size: 20px; }
  .mcard p { font-size: 14.5px; color: var(--muted); line-height: 1.45; }

  /* Toasts */
  #toasts { position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 74px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 40; }
  .toast {
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 14px; font-size: 14.5px; font-weight: 700;
    background: rgba(15, 23, 42, 0.92); border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0,0,0,.4);
    display: flex; align-items: center; gap: 8px; animation: toastIn .28s ease-out both;
  }
  .toast svg { color: var(--accent); font-size: 18px; }
  .toast.out { animation: toastOut .25s ease-in both; }
  @keyframes toastIn { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .screen, .toast, .rstars .on { transition: none !important; animation: none !important; }
  }
  @media (max-height: 640px) {
    .logo { margin-top: 1vh; }
    .logo h1 { font-size: 38px; }
    .logo-blocks { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="score">0</div>
  <div id="info"></div>
  <div id="msg"></div>
</div>
<div id="zone"></div>
<button id="pauseBtn" class="ib" data-act="pause" aria-label="Pause"></button>

<section id="scr-menu" class="screen" aria-label="Main menu"></section>
<section id="scr-worlds" class="screen dim" aria-label="Worlds"></section>
<section id="scr-levels" class="screen dim" aria-label="Levels"></section>
<section id="scr-skins" class="screen dim" aria-label="Skins"></section>
<section id="scr-settings" class="screen dim" aria-label="Settings"></section>
<section id="scr-stats" class="screen dim" aria-label="Stats"></section>
<section id="scr-howto" class="screen dim" aria-label="How to play"></section>
<section id="scr-pause" class="screen dim" aria-label="Paused"></section>
<section id="scr-result" class="screen dim" aria-label="Result"></section>
<div id="modal" class="screen dim modal" role="dialog" aria-modal="true"></div>
<div id="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('c'), ctx = canvas.getContext('2d');
  const hudEl = $('hud'), scoreEl = $('score'), infoEl = $('info'), msgEl = $('msg'), zoneEl = $('zone');
  const pauseBtn = $('pauseBtn');

  // ---------------------------------------------------------------
  // Gameplay constants (unchanged from the original game)
  // ---------------------------------------------------------------
  const GW = 360, GH = 640;  // logical world size, scaled to fit the screen
  const BH = 28;             // block height
  const GROUND = 560;        // y of the base block's bottom edge
  const PERFECT_TOL = 4;     // how close counts as a perfect drop
  const GOLD_TOL = 6;        // gold blocks are a bit more forgiving, but must be perfect

  // Visual-only: oblique 3D. The front face is exactly the gameplay rectangle (w x BH);
  // top and right side faces recede by DX/DY and are never used for collision.
  const DX = 9, DY = 7;
  const GOLD_C = { h: 43, s: 96, l: 56, mat: 'gloss' };

  // Levels: t = target height, base = starting width, speed, wobble = speed changes, gold = every Nth block must be perfect
  const LEVELS = [
    { t: 10, speed: 2.0 },
    { t: 12, speed: 2.2 },
    { t: 12, speed: 2.2, base: 150 },
    { t: 15, speed: 2.5 },
    { t: 15, speed: 3.3 },
    { t: 15, speed: 2.6, base: 140 },
    { t: 15, speed: 2.6, wobble: true },
    { t: 18, speed: 3.0 },
    { t: 15, speed: 2.6, gold: 5 },
    { t: 18, speed: 3.3, base: 130 },
    { t: 18, speed: 3.0, wobble: true },
    { t: 20, speed: 3.0, gold: 4 },
    { t: 20, speed: 3.2, base: 120 },
    { t: 20, speed: 3.8 },
    { t: 20, speed: 3.2, base: 140, wobble: true },

      const sg = bgCtx.createRadialGradient(sx, sy, 0, sx, sy, sr * 6);
      sg.addColorStop(0, 'rgba(255,200,140,0.55)');
      sg.addColorStop(0.3, 'rgba(255,150,110,0.18)');
      sg.addColorStop(1, 'rgba(255,120,100,0)');
      bgCtx.fillStyle = sg;
      bgCtx.fillRect(0, 0, W, H);
      bgCtx.fillStyle = 'rgba(255,214,160,0.95)';
      bgCtx.beginPath();
      bgCtx.arc(sx, sy, sr, 0, Math.PI * 2);
      bgCtx.fill();
    }
    if (E.aurora) {                                        // soft aurora bands
      try { bgCtx.filter = `blur(${Math.round(H * 0.012)}px)`; } catch (e) {}
      [[0.16, 'rgba(110,255,190,0.20)', 1.0], [0.24, 'rgba(90,200,255,0.14)', 1.6]].forEach(([yy, col, k], j) => {
        bgCtx.beginPath();
        const steps = 24;
        for (let i = 0; i <= steps; i++) {
          const x = W * i / steps;
          const y = H * yy + Math.sin(i * 0.55 * k + j) * H * 0.03;
          if (i === 0) bgCtx.moveTo(x, y); else bgCtx.lineTo(x, y);
        }
        for (let i = steps; i >= 0; i--) {
          const x = W * i / steps;
          bgCtx.lineTo(x, H * yy + Math.sin(i * 0.55 * k + j) * H * 0.03 + H * 0.07);
        }
        bgCtx.closePath();
        bgCtx.fillStyle = col;
        bgCtx.fill();
      });
      try { bgCtx.filter = 'none'; } catch (e) {}
    }
    if (envId === 'neon') {                                // magenta city glow at the horizon
      const ng = bgCtx.createRadialGradient(W / 2, H * 0.95, 0, W / 2, H * 0.95, Math.max(W, H) * 0.6);
      ng.addColorStop(0, 'rgba(236,72,153,0.28)');
      ng.addColorStop(1, 'rgba(236,72,153,0)');
      bgCtx.fillStyle = ng;
      bgCtx.fillRect(0, 0, W, H);
    }
    const hz = bgCtx.createLinearGradient(0, H * 0.68, 0, H);
    hz.addColorStop(0, 'rgba(0,0,0,0)');
    hz.addColorStop(1, t.haze);
    bgCtx.fillStyle = hz;
    bgCtx.fillRect(0, H * 0.68, W, H * 0.32);
    const v = bgCtx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.32)');
    bgCtx.fillStyle = v;
    bgCtx.fillRect(0, 0, W, H);
    // Danger vignette for Rising mode (drawn with varying alpha, never rebuilt per frame)
    dangerCanvas.width = W;
    dangerCanvas.height = H;
    const dv = dangerCtx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.72);
    dv.addColorStop(0, 'rgba(220,38,38,0)');
    dv.addColorStop(1, 'rgba(220,38,38,0.85)');
    dangerCtx.fillStyle = dv;
    dangerCtx.fillRect(0, 0, W, H);
    for (let i = 1; i < 4; i++) freeSky(i);               // higher skies depend on the world: rebuilt on demand
    buildScenery();
    buildSprites();
  }

  // --- scenery layers -------------------------------------------------
  function buildScenery() {
    const E = ENVS[envId];
    const W = canvas.width;
    const top = hexRgb(E.sky.top), bot = hexRgb(E.sky.bottom);
    const fogC = mixRgb(bot, [200, 215, 255], 0.18);
    const cx = ox + (GW + DX) / 2 * scale;            // centre of the play area on screen
    const towerHalf = Math.max(1, 110 * scale);
    cityLayers.length = 0;
    twinkles.length = 0;

    E.layers.forEach((L, li) => {
      const lh = Math.ceil((L.hMax + 50) * scale);       // room for roofs, antennas and peaks (whole px)
      const c = document.createElement('canvas');
      c.width = W;
      c.height = lh;
      const g = c.getContext('2d');
      const rnd = seeded(101 + li * 977 + envId.length * 31);
      const body = mixRgb(mixRgb(top, bot, L.tone), fogC, L.fog);
      const blds = [];                                    // [x, width, top y] (layout info)
      const clearAt = x => {                              // shrink scenery right behind the tower
        if (!L.clear) return 1;
        const dc = Math.abs(x - cx) / towerHalf;
        return L.clear + (1 - L.clear) * Math.min(1, Math.max(0, (dc - 0.6) / 0.9));
      };
      if (li === 0) {                                     // light glow behind the far layer
        const gl = g.createLinearGradient(0, lh * 0.15, 0, lh);
        gl.addColorStop(0, 'rgba(0,0,0,0)');
        const glowC = envId === 'neon' ? [236, 72, 153] : envId === 'snow' ? [160, 220, 255] : [255, 160, 120];
        gl.addColorStop(1, rgba(mixRgb(bot, glowC, 0.3), 0.4));
        g.fillStyle = gl;
        g.fillRect(0, 0, W, lh);
      }
      if (L.shape === 'tower') buildTowers(g, L, li, W, lh, body, rnd, blds, clearAt, cx, towerHalf);
      else if (L.shape === 'dune') buildDunes(g, L, W, lh, body, rnd, blds, clearAt);
      else if (L.shape === 'mesa') buildMesas(g, L, W, lh, body, rnd, blds, clearAt);
      else if (L.shape === 'peak') buildPeaks(g, L, W, lh, body, rnd, blds, clearAt);
      else if (L.shape === 'pine') buildPines(g, L, W, lh, body, rnd, blds, clearAt);

      // Atmospheric fade toward the base, applied only on top of the scenery
      g.globalCompositeOperation = 'source-atop';
      const fg = g.createLinearGradient(0, lh * 0.35, 0, lh);
      fg.addColorStop(0, rgba(fogC, 0));
      fg.addColorStop(1, rgba(fogC, L.baseFog));
      g.fillStyle = fg;
      g.fillRect(0, 0, W, lh);
      g.globalCompositeOperation = 'source-over';
      // Opaque haze band at the base (also across gaps), continued below the layer each frame
      const fillC = mixRgb(mixRgb(body, fogC, L.baseFog), fogC, 0.25);
      const bandH = 40 * scale;
      const bg2 = g.createLinearGradient(0, lh - bandH, 0, lh);
      bg2.addColorStop(0, rgba(fillC, 0));
      bg2.addColorStop(1, rgba(fillC, 1));
      g.fillStyle = bg2;
      g.fillRect(0, lh - bandH, W, bandH);
      cityLayers.push({ c, lh, f: L.f, lift: L.lift, fill: L.lift > 0 ? rgba(fillC) : null, blds });
    });

    // Haze below: a 1px-wide gradient, stretched when drawn (almost no memory)
    hazeCanvas.width = 1;
    hazeCanvas.height = 256;
    const zg = hazeCanvas.getContext('2d');
    const zz = zg.createLinearGradient(0, 0, 0, 256);
    zz.addColorStop(0, rgba(fogC, 0));
    zz.addColorStop(1, rgba(mixRgb(fogC, [230, 236, 255], 0.25), 0.9));
    zg.fillStyle = zz;
    zg.fillRect(0, 0, 1, 256);

    // Ground the tower stands on (world space; gradient starts at the ground edge)
    const gr = E.ground;
    const gTop = gr.top || mixRgb(top, bot, 0.42), gBot = gr.bottom || mixRgb(top, [0, 0, 0], 0.3);
    floorGrad = ctx.createLinearGradient(0, 0, 0, 120);
    floorGrad.addColorStop(0, rgba(gTop));
    floorGrad.addColorStop(1, rgba(gBot));

    sceneCanvas.width = canvas.width;
    sceneCanvas.height = canvas.height;
    sceneValid = false;
  }

  function buildTowers(g, L, li, W, lh, body, rnd, blds, clearAt, cx, towerHalf) {
    const neon = !!L.neon;
    const warm = [255, 214, 150], cool = [170, 205, 255];
    const NEON = [[236, 72, 153], [34, 211, 238], [250, 204, 21], [167, 139, 250]];
    const edge = rgba(mixRgb(body, [255, 255, 255], 0.08));
    let x = -rnd() * 40;
    while (x < W) {
      const bw = (L.wMin + rnd() * (L.wMax - L.wMin)) * scale;
      const dc = Math.abs(x + bw / 2 - cx) / towerHalf;
      const bh = (L.hMin + Math.pow(rnd(), 1.4) * (L.hMax - L.hMin)) * scale * clearAt(x + bw / 2);
      const y = lh - bh;
      blds.push([x, bw, y]);
      g.fillStyle = rgba(body);
      g.fillRect(x, y, bw, bh);
      g.fillStyle = edge;                                 // lit left edge: same key light as the blocks
      g.fillRect(x, y, Math.max(1, bw * 0.06), bh);
      const roof = rnd();
      let ry = y;
      if (roof < 0.35) {                                  // stepped top
        const sw = bw * (0.45 + rnd() * 0.3), sh = (8 + rnd() * 14) * scale;
        g.fillStyle = rgba(body);
        g.fillRect(x + (bw - sw) / 2, y - sh, sw, sh);
        ry = y - sh;
      }
      if (roof > 0.7 || roof < 0.12) {                    // antenna with a red beacon
        const ah = (12 + rnd() * 24) * scale;
        g.fillStyle = rgba(body);
        g.fillRect(x + bw * 0.5 - 0.75, ry - ah, 1.5, ah);
        g.fillStyle = 'rgba(255,90,90,0.8)';
        g.fillRect(x + bw * 0.5 - 1.25, ry - ah - 1.5, 2.5, 2.5);
      }
      const nc = NEON[Math.floor(rnd() * NEON.length)];
      if (neon) {                                         // glowing roof line
        g.fillStyle = rgba(nc, li === 2 ? 0.85 : 0.6);
        g.fillRect(x, y, bw, Math.max(1, 1.2 * scale));
        if (rnd() < 0.35 && bw > 20 * scale) {            // vertical sign
          const sw2 = 3.5 * scale, sh2 = Math.min(bh * 0.4, 60 * scale);
          const sx2 = x + bw * (0.2 + rnd() * 0.6), sy2 = y + 10 * scale;
          g.fillStyle = rgba(nc, 0.75);
          g.fillRect(sx2, sy2, sw2, sh2);
          if (li > 0 && twinkles.length < 10) twinkles.push({ li, x: sx2, y: sy2, w: sw2, h: sh2, c: rgba(nc, 1), ph: rnd() * 6.28, sp: 0.04 + rnd() * 0.05 });
        }
      }
      // Windows: sparse, dimmed behind the tower
      const lit = L.win * (0.5 + rnd());
      const ws = L.wsz * scale;
      const sx = ws * 2.4, sy = ws * 3.2;
      const wc = neon ? (rnd() < 0.5 ? NEON[0] : NEON[1]) : (rnd() < 0.7 ? warm : cool);
      const dim = L.clear && dc < 1.2 ? 0.35 : 1;
      for (let wy = y + sy; wy < lh - sy; wy += sy) {
        for (let wx = x + sx * 0.7; wx < x + bw - ws - sx * 0.3; wx += sx) {
          if (rnd() >= lit) continue;
          g.fillStyle = rgba(wc, ((0.35 + rnd() * 0.45) * L.winA * dim).toFixed(3));
          g.fillRect(wx, wy, ws, ws * 1.3);
          if (!neon && li > 0 && dim === 1 && twinkles.length < 8 && rnd() < 0.02) {
            twinkles.push({ li, x: wx, y: wy, w: ws, h: ws * 1.3, c: rgba(wc, 1), ph: rnd() * 6.28, sp: 0.02 + rnd() * 0.03 });
          }
        }
      }
      x += bw + rnd() * L.gap * scale;
    }
  }

  // Smooth dune ridges from a few summed sine waves, with a light crest line
  function buildDunes(g, L, W, lh, body, rnd, blds, clearAt) {
    const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
    const wl = L.wave.map(v => v * scale * (0.8 + rnd() * 0.4));
    const pts = [];
    for (let x = 0; x <= W + 4; x += 4) {
      const n = 0.5 + 0.28 * Math.sin(x / wl[0] + ph[0]) + 0.15 * Math.sin(x / wl[1] + ph[1]) + 0.07 * Math.sin(x / wl[2] + ph[2]);
      const h = (L.hMin + (L.hMax - L.hMin) * Math.max(0, Math.min(1, n))) * scale * clearAt(x);
      pts.push([x, lh - h]);
    }
    for (let i = 0; i < pts.length; i += 6) blds.push([pts[i][0], 24, pts[i][1]]);
    g.beginPath();
    g.moveTo(0, lh);
    pts.forEach(([x, y]) => g.lineTo(x, y));
    g.lineTo(W, lh);
    g.closePath();
    g.fillStyle = rgba(body);
    g.fill();
    // sunlit upper slopes
    g.globalCompositeOperation = 'source-atop';
    const sg = g.createLinearGradient(0, lh - L.hMax * scale, 0, lh);
    sg.addColorStop(0, 'rgba(255,214,170,0.22)');
    sg.addColorStop(1, 'rgba(255,214,170,0)');
    g.fillStyle = sg;
    g.fillRect(0, 0, W, lh);
    g.globalCompositeOperation = 'source-over';
    g.beginPath();
    pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
    g.strokeStyle = 'rgba(255,226,190,0.35)';
    g.lineWidth = Math.max(1, scale);
    g.stroke();
  }

  // Flat-topped buttes with strata, and the odd pyramid
  function buildMesas(g, L, W, lh, body, rnd, blds, clearAt) {
    let x = -rnd() * 60 * scale;
    while (x < W) {
      const bw = (L.wMin + rnd() * (L.wMax - L.wMin)) * scale;
      const bh = (L.hMin + rnd() * (L.hMax - L.hMin)) * scale * clearAt(x + bw / 2);
      const y = lh - bh;
      blds.push([x, bw, y]);
      g.fillStyle = rgba(body);
      g.beginPath();
      if (rnd() < L.pyr) {
        g.moveTo(x, lh); g.lineTo(x + bw / 2, y); g.lineTo(x + bw, lh);
      } else {
        const inset = bw * (0.12 + rnd() * 0.12);
        g.moveTo(x, lh); g.lineTo(x + inset, y); g.lineTo(x + bw - inset * 0.8, y); g.lineTo(x + bw, lh);
      }
      g.closePath();
      g.fill();
      g.save();
      g.clip();
      for (let sy = y + 8 * scale; sy < lh; sy += 11 * scale) {
        g.fillStyle = 'rgba(255,220,190,0.07)';
        g.fillRect(x, sy, bw, 2 * scale);
      }
      g.fillStyle = 'rgba(255,226,196,0.1)';             // lit left side
      g.fillRect(x, y, bw * 0.3, bh);
      g.restore();
      x += bw + (10 + rnd() * L.gap) * scale;
    }
  }

  // Jagged mountain range with snow caps
  function buildPeaks(g, L, W, lh, body, rnd, blds, clearAt) {
    const peaks = [];
    let x = -rnd() * 40 * scale;
    while (x < W + 120 * scale) {
      const bw = (L.wMin + rnd() * (L.wMax - L.wMin)) * scale;
      const ph = (L.hMin + rnd() * (L.hMax - L.hMin)) * scale * clearAt(x);
      peaks.push([x, lh - ph, ph]);
      x += bw;
    }
    const valleys = [];
    for (let i = 0; i < peaks.length - 1; i++) {
      const vh = Math.min(peaks[i][2], peaks[i + 1][2]) * (0.45 + rnd() * 0.2);
      valleys.push([(peaks[i][0] + peaks[i + 1][0]) / 2 + (rnd() - 0.5) * 8 * scale, lh - vh]);
    }
    g.beginPath();
    g.moveTo(peaks[0][0] - 60 * scale, lh);
    peaks.forEach((p, i) => { g.lineTo(p[0], p[1]); if (valleys[i]) g.lineTo(valleys[i][0], valleys[i][1]); });
    g.lineTo(peaks[peaks.length - 1][0] + 60 * scale, lh);
    g.closePath();
    g.fillStyle = rgba(body);
    g.fill();
    g.save();
    g.clip();                                              // caps and light only inside the range
    for (const [px, py, ph] of peaks) {
      blds.push([px - 20 * scale, 40 * scale, py]);
      const cap = ph * (0.22 + rnd() * 0.1);
      g.fillStyle = `rgba(240,248,255,${L.cap || 0.8})`;
      g.beginPath();
      g.moveTo(px, py - 2);
      g.lineTo(px - cap * 1.1, py + cap);
      g.lineTo(px - cap * 0.4, py + cap * 0.8);
      g.lineTo(px, py + cap * 1.05);
      g.lineTo(px + cap * 0.5, py + cap * 0.75);
      g.lineTo(px + cap * 1.1, py + cap);
      g.closePath();
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.07)';             // lit left faces
      g.beginPath();
      g.moveTo(px, py); g.lineTo(px - ph * 0.9, lh); g.lineTo(px, lh);
      g.closePath();
      g.fill();
    }
    g.restore();
  }

  // Low ridge with pine trees and snowy tips
  function buildPines(g, L, W, lh, body, rnd, blds, clearAt) {
    const ridge = 12 * scale;
    g.fillStyle = rgba(body);
    g.fillRect(0, lh - ridge, W, ridge);
    let x = -rnd() * 10 * scale;
    while (x < W) {
      const tw = (L.wMin + rnd() * (L.wMax - L.wMin)) * scale;
      const th = (L.hMin + rnd() * (L.hMax - L.hMin)) * scale * clearAt(x + tw / 2);
      if (th > 10 * scale) {
        const base = lh - ridge * 0.6, tx = x + tw / 2, ty = base - th;
        blds.push([x, tw, ty]);
        g.fillStyle = rgba(body);
        for (let k = 0; k < 3; k++) {
          const ky = ty + th * k * 0.28, kw = tw * (0.55 + k * 0.25);
          g.beginPath();
          g.moveTo(tx, ky); g.lineTo(tx - kw / 2, ky + th * 0.42); g.lineTo(tx + kw / 2, ky + th * 0.42);
          g.closePath();
          g.fill();
          g.fillStyle = 'rgba(240,248,255,0.55)';
          g.beginPath();
          g.moveTo(tx, ky); g.lineTo(tx - kw * 0.16, ky + th * 0.12); g.lineTo(tx + kw * 0.16, ky + th * 0.12);
          g.closePath();
          g.fill();
          g.fillStyle = rgba(body);
        }
        g.fillRect(tx - 1.5 * scale, base - th * 0.1, 3 * scale, th * 0.12);
      }
      x += tw * (0.55 + rnd() * 0.7);
    }
  }

  // --- higher skies (built only when the tower gets there) -----------
  function freeSky(i) { if (i > 0 && skyBuilt[i]) { skyStage[i].width = skyStage[i].height = 0; skyBuilt[i] = false; } }
  function ensureSky(i) { if (i > 0 && !skyBuilt[i]) { buildSky(i); skyBuilt[i] = true; } }
  function buildSky(i) {
    const W = canvas.width, H = canvas.height;
    const c = skyStage[i];
    c.width = W;
    c.height = H;
    const g = c.getContext('2d');
    const E = ENVS[envId];
    const top = hexRgb(E.sky.top), bot = hexRgb(E.sky.bottom);
    const fogC = mixRgb(bot, [200, 215, 255], 0.18);
    const dp = H / 800;
    const stars = (n, seed, maxY, bright) => {
      const sr = seeded(seed);
      for (let k = 0; k < n; k++) {
        const y = sr() * H * maxY;
        const sz = (0.6 + sr() * 1.3) * dp;
        g.fillStyle = `rgba(255,255,255,${((0.25 + sr() * 0.6) * bright * (1 - 0.6 * y / H)).toFixed(3)})`;
        g.fillRect(sr() * W, y, sz, sz);
      }
    };
    const grad = stops => { const s = g.createLinearGradient(0, 0, 0, H); stops.forEach(([o, col]) => s.addColorStop(o, col)); g.fillStyle = s; g.fillRect(0, 0, W, H); };
    const earth = (topFrac, glowA) => {
      const R = Math.max(W, H) * 1.5;
      const ex = W / 2, ey = H * topFrac + R;
      const eg = g.createRadialGradient(ex, ey - R * 0.9, R * 0.05, ex, ey, R);
      eg.addColorStop(0, '#2f6fb0');
      eg.addColorStop(0.6, '#163d6e');
      eg.addColorStop(1, '#0a1f3d');
      g.fillStyle = eg;
      g.beginPath(); g.arc(ex, ey, R, 0, Math.PI * 2); g.fill();
      const cr = seeded(55);
      for (let k = 0; k < 14; k++) {                       // cloud swirls on the planet
        g.fillStyle = `rgba(255,255,255,${(0.05 + cr() * 0.08).toFixed(3)})`;
        g.beginPath();
        g.ellipse(cr() * W, H * topFrac + H * (0.02 + cr() * 0.2), W * (0.05 + cr() * 0.12), H * (0.006 + cr() * 0.01), 0, 0, Math.PI * 2);
        g.fill();
      }
      g.strokeStyle = `rgba(125,200,255,${0.75 * glowA})`;
      g.lineWidth = H * 0.006;
      g.beginPath(); g.arc(ex, ey, R, 0, Math.PI * 2); g.stroke();
      g.strokeStyle = `rgba(90,170,255,${0.2 * glowA})`;
      g.lineWidth = H * 0.07;
      g.beginPath(); g.arc(ex, ey, R + H * 0.035, 0, Math.PI * 2); g.stroke();
    };
    if (i === 1) {                                        // high open sky with stars
      grad([[0, rgba(mixRgb(top, [0, 0, 0], 0.45))], [0.65, rgba(mixRgb(top, bot, 0.45))], [1, rgba(mixRgb(bot, fogC, 0.5))]]);
      stars(160, 4242, 0.8, 1);
    } else if (i === 2) {                                 // stratosphere: deep blue, planet curve below
      grad([[0, '#02040c'], [0.55, '#06163a'], [1, '#1b4c8a']]);
      stars(120, 777, 0.7, 0.8);
      earth(0.8, 1);
    } else {                                              // space: black, dense stars, milky band
      grad([[0, '#000004'], [1, '#05071a']]);
      stars(300, 9191, 1, 1.2);
      const mr = seeded(31337);
      for (let k = 0; k < 420; k++) {
        const u = mr();
        const bx = u * W, by = H * (0.15 + u * 0.55) + (mr() - 0.5) * H * 0.12;
        g.fillStyle = `rgba(200,210,255,${(0.04 + mr() * 0.12).toFixed(3)})`;
        g.fillRect(bx, by, 1.4 * dp, 1.4 * dp);
      }
      earth(0.95, 0.6);
    }
    const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.3)');
    g.fillStyle = vg;
    g.fillRect(0, 0, W, H);
  }
  const skyCanvas = i => skyStage[i];
  // 0 = ground sky, 1 = high sky, 2 = stratosphere, 3 = space (fractions cross-fade)
  const skyLevel = h => smooth(CITY.skyFrom, CITY.skyTo, h) + smooth(55, 70, h) + smooth(78, 92, h);

  // --- sprites (clouds, fly-bys, moon) --------------------------------
  function buildSprites() {
    const W = canvas.width, H = canvas.height;
    const E = ENVS[envId];
    const bot = hexRgb(E.sky.bottom);
    const fogC = mixRgb(bot, [200, 215, 255], 0.18);
    const dp = H / 800;
    const cloudC = mixRgb(fogC, [235, 240, 255], 0.55);
    const puff = (cw, ch, seed, alpha) => {
      const c = document.createElement('canvas');
      c.width = Math.ceil(cw);
      c.height = Math.ceil(ch);
      const g = c.getContext('2d');
      const r = seeded(seed);
      for (let i = 0; i <= 10; i++) {
        const u = i / 10;
        const px = cw * (0.12 + 0.76 * u) + (r() - 0.5) * cw * 0.06;
        const py = ch * (0.6 - Math.sin(u * Math.PI) * 0.18);
        const rad = ch * (0.26 + 0.28 * Math.sin(u * Math.PI) + r() * 0.08);
        const rg = g.createRadialGradient(px, py, 0, px, py, rad);
        rg.addColorStop(0, rgba(cloudC, alpha));
        rg.addColorStop(1, rgba(cloudC, 0));
        g.fillStyle = rg;
        g.fillRect(px - rad, py - rad, rad * 2, rad * 2);
      }
      return c;
    };
    cloudSprites.length = 0;
    for (let v = 0; v < 4; v++) {
      const sz = v < 2 ? 0.7 : 1.05;                       // two shapes, two sizes
      cloudSprites.push(puff(W * 0.55 * sz, H * 0.085 * sz, 77 + (v % 2) * 31, 0.62));
    }
    fgSprites.length = 0;                                  // big near clouds that pass in front
    fgSprites.push(puff(W * 0.95, H * 0.16, 501, 0.72), puff(W * 0.8, H * 0.13, 733, 0.72));
    clouds.length = 0;
    const cr = seeded(9001);
    for (let i = 0; i < 8; i++) {
      clouds.push({ x: (cr() * 1.2 - 0.2) * W, y0: cr() * (H * 1.6),
        f: 0.45 + cr() * 0.45, a: 0.35 + cr() * 0.4, v: (cr() - 0.5) * 0.25 * dp, sp: (i % 2) + (cr() < 0.5 ? 0 : 2) });
    }
    fgClouds.length = 0;
    for (let i = 0; i < 3; i++) {
      fgClouds.push({ x: (cr() * 1.1 - 0.3) * W, y0: cr() * H * 2, f: 1.5 + cr() * 0.4, a: 0.45 + cr() * 0.2, v: (cr() - 0.5) * 0.5 * dp, sp: i % 2 });
    }

    // Fly-by silhouettes, lit softly so they read against a night sky
    const d = H / Math.max(1, innerHeight);
    const ink = rgba(E.ink, 0.85), inkSoft = rgba(E.ink, 0.5);
    const mk = (w, h, draw) => {
      const c = document.createElement('canvas');
      c.width = Math.ceil(w * d);
      c.height = Math.ceil(h * d);
      const g = c.getContext('2d');
      g.scale(d, d);
      g.lineCap = 'round';
      g.lineJoin = 'round';
      draw(g, w, h);
      return c;
    };
    const flock = up => (g) => {
      g.strokeStyle = ink;
      g.lineWidth = 1.5;
      [[6, 8], [15, 4], [24, 9], [32, 5], [19, 12]].forEach(([bx, by]) => {
        g.beginPath();
        g.moveTo(bx - 4, by + (up ? -2.5 : 2));
        g.lineTo(bx, by);
        g.lineTo(bx + 4, by + (up ? -2.5 : 2));
        g.stroke();
      });
    };
    spr.birds = [mk(40, 16, flock(true)), mk(40, 16, flock(false))];
    spr.heli = mk(48, 22, g => {
      g.fillStyle = ink;
      g.beginPath(); g.ellipse(17, 12, 10, 5.5, 0, 0, Math.PI * 2); g.fill();
      g.fillRect(25, 10.5, 18, 2.4);
      g.fillRect(42, 7, 2.2, 7);
      g.fillRect(4, 4.5, 28, 1.6);
      g.fillRect(16.4, 5, 1.4, 3);
      g.strokeStyle = inkSoft; g.lineWidth = 1.2;
      g.beginPath(); g.moveTo(10, 19); g.lineTo(25, 19); g.stroke();
      g.fillStyle = 'rgba(150,220,255,0.6)';
      g.beginPath(); g.ellipse(12, 11, 4, 3, 0, 0, Math.PI * 2); g.fill();
    });
    const pal = [[244, 114, 182], [250, 204, 21], [56, 189, 248], [52, 211, 153]];
    spr.balloon = [0, 1].map(k => mk(26, 38, g => {
      const c1 = pal[k * 2], c2 = pal[k * 2 + 1];
      g.save();
      g.beginPath(); g.arc(13, 12, 11, Math.PI * 0.95, Math.PI * 2.05); g.lineTo(16, 26); g.lineTo(10, 26); g.closePath();
      g.clip();
      for (let s = 0; s < 6; s++) { g.fillStyle = rgba(s % 2 ? c1 : c2, 0.9); g.fillRect(s * 4.4, 0, 4.4, 28); }
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(2, 0, 7, 28);
      g.restore();
      g.strokeStyle = inkSoft; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(10, 26); g.lineTo(11, 31); g.moveTo(16, 26); g.lineTo(15, 31); g.stroke();
      g.fillStyle = 'rgba(120,80,50,0.95)'; g.fillRect(10.5, 31, 5, 4);
    }));
    spr.plane = mk(72, 24, g => {
      g.fillStyle = ink;
      g.beginPath(); g.moveTo(6, 12); g.quadraticCurveTo(4, 9.5, 10, 9.5); g.lineTo(62, 9.5); g.quadraticCurveTo(68, 11.5, 62, 13.5); g.lineTo(10, 13.5); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(30, 11); g.lineTo(44, 11); g.lineTo(34, 21); g.lineTo(29, 21); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(8, 10); g.lineTo(13, 10); g.lineTo(9, 3); g.lineTo(6, 3); g.closePath(); g.fill();
      g.fillStyle = 'rgba(120,160,220,0.7)';
      for (let k = 0; k < 9; k++) g.fillRect(18 + k * 4.5, 10.6, 2, 1.4);
    });
    spr.jet = mk(30, 10, g => {
      g.fillStyle = ink;
      g.beginPath(); g.moveTo(2, 5); g.lineTo(26, 4); g.lineTo(28, 5); g.lineTo(26, 6); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(12, 5); g.lineTo(18, 5); g.lineTo(13, 9.5); g.lineTo(11, 9.5); g.closePath(); g.fill();
    });
    spr.wballoon = mk(16, 34, g => {
      g.fillStyle = 'rgba(245,248,255,0.92)';
      g.beginPath(); g.arc(8, 8, 6.5, 0, Math.PI * 2); g.fill();
      g.strokeStyle = inkSoft; g.lineWidth = 0.8;
      g.beginPath(); g.moveTo(8, 14.5); g.lineTo(8, 27); g.stroke();
      g.fillStyle = 'rgba(250,204,21,0.9)'; g.fillRect(6, 27, 4, 4);
    });
    spr.sat = mk(56, 24, g => {
      g.fillStyle = 'rgba(80,130,220,0.95)';
      g.fillRect(2, 9, 18, 7); g.fillRect(36, 9, 18, 7);
      g.strokeStyle = 'rgba(200,220,255,0.6)'; g.lineWidth = 0.6;
      for (let k = 1; k < 4; k++) { g.beginPath(); g.moveTo(2 + k * 4.5, 9); g.lineTo(2 + k * 4.5, 16); g.moveTo(36 + k * 4.5, 9); g.lineTo(36 + k * 4.5, 16); g.stroke(); }
      g.fillStyle = 'rgba(230,190,110,0.95)'; g.fillRect(21, 7, 14, 11);
      g.fillStyle = ink; g.fillRect(20, 12, 1.5, 1.5); g.fillRect(35, 12, 1.5, 1.5);
      g.strokeStyle = ink; g.lineWidth = 1;
      g.beginPath(); g.moveTo(28, 7); g.lineTo(28, 2); g.stroke();
    });
    // Moon: one sprite, scaled up while in space
    const mr = Math.ceil(H * 0.1);
    const moon = document.createElement('canvas');
    moon.width = moon.height = mr * 2 + 4;
    const mg = moon.getContext('2d');
    const mgd = mg.createRadialGradient(mr * 0.7, mr * 0.7, mr * 0.1, mr + 2, mr + 2, mr);
    mgd.addColorStop(0, '#f8fafc');
    mgd.addColorStop(1, '#94a3b8');
    mg.fillStyle = mgd;
    mg.beginPath(); mg.arc(mr + 2, mr + 2, mr, 0, Math.PI * 2); mg.fill();
    const crt = seeded(808);
    for (let k = 0; k < 9; k++) {
      mg.fillStyle = `rgba(71,85,105,${(0.18 + crt() * 0.2).toFixed(2)})`;
      const a = crt() * Math.PI * 2, rr = crt() * mr * 0.7;
      mg.beginPath(); mg.arc(mr + 2 + Math.cos(a) * rr, mr + 2 + Math.sin(a) * rr, mr * (0.06 + crt() * 0.14), 0, Math.PI * 2); mg.fill();
    }
    spr.moon = moon;
  }

  // Background stack for one frame: skies, scenery layers, haze.
  // Positions use a whole-pixel camera value so the cached and direct paths look identical.
  function paintScene(g, camPx, sky, hazeA) {
    const W = canvas.width, H = canvas.height;
    const a = Math.min(3, Math.floor(sky)), fr = sky - a;
    g.globalAlpha = 1;
    ensureSky(a);
    g.drawImage(skyCanvas(a), 0, 0);
    if (fr > 0.004 && a < 3) {
      ensureSky(a + 1);
      g.globalAlpha = fr;
      g.drawImage(skyCanvas(a + 1), 0, 0);
      g.globalAlpha = 1;
    }
    for (let i = 1; i < 4; i++) if (i !== a && i !== a + 1) freeSky(i);
    for (const L of cityLayers) {
      // whole-pixel position: a plain 1:1 copy instead of resampling
      const base = Math.round(oy + (GROUND - L.lift) * scale + camPx * L.f);
      const y = base - L.lh;
      if (y >= H) continue;                               // scrolled away below the screen
      g.drawImage(L.c, 0, y);
      if (L.fill && base < H) {                           // hazy land below this layer
        g.fillStyle = L.fill;
        g.fillRect(0, base - 1, W, H - base + 1);
      }
    }
    if (hazeA > 0.01) {
      g.globalAlpha = hazeA;
      g.drawImage(hazeCanvas, 0, H * 0.45, W, H * 0.55);
      g.globalAlpha = 1;
    }
  }

  // Ambient particles in screen space (fixed set, no allocation per frame)
  const motes = [];
  {
    const rnd = seeded(7);
    for (let i = 0; i < 34; i++) motes.push({ x: rnd(), y: rnd(), s: 0.6 + rnd() * 1.4, a: 0.12 + rnd() * 0.3, p: rnd() * 6.28 });
  }

  // ---------------------------------------------------------------
  // Sound: procedural Web Audio, no sound files
  // ---------------------------------------------------------------
  let audioCtx = null, master = null, noiseBuf = null;
  const MAX_VOICES = 16;
  let voices = 0, voicesStarted = 0;
  const lastPlay = {};
  function ensureAudio() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
        const comp = audioCtx.createDynamicsCompressor();   // keeps stacked sounds from getting harsh
        comp.threshold.value = -18;
        comp.knee.value = 12;
        comp.ratio.value = 4;
        master = audioCtx.createGain();
        master.gain.value = 0.8;
        master.connect(comp);
        comp.connect(audioCtx.destination);
        // Preloaded once: a short noise buffer shared by every noisy sound
        noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.5), audioCtx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  // Cooldown per sound so rapid taps don't pile up
  function ready(key, gapMs) {
    if (!soundOn || !audioCtx || !master) return false;
    const now = performance.now();
    if (lastPlay[key] && now - lastPlay[key] < gapMs) return false;
    lastPlay[key] = now;
    return true;
  }
  function tone(freq, dur, type, vol, delay = 0, endFreq = 0) {
    if (voices >= MAX_VOICES) return;
    const t = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(master);
    voices++; voicesStarted++;
    o.onended = () => { voices--; };
    o.start(t);
    o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, filterType, freq, delay = 0, endFreq = 0, q = 1) {
    if (voices >= MAX_VOICES) return;
    const t = audioCtx.currentTime + delay;
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuf;
    const f = audioCtx.createBiquadFilter();
    f.type = filterType;
    f.Q.value = q;
    f.frequency.setValueAtTime(freq, t);
    if (endFreq) f.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    voices++; voicesStarted++;
    src.onended = () => { voices--; };
    src.start(t, Math.random() * 0.15);
    src.stop(t + dur + 0.02);
  }
  // Major pentatonic notes: combos climb this scale, so it always sounds pleasant
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
  const sfx = {
    tap() {
      if (!ready('tap', 40)) return;
      noise(0.045, 0.16, 'bandpass', 2300, 0, 0, 1.2);
      tone(190, 0.08, 'triangle', 0.22, 0, 120);
    },
    perfect(n) {
      if (!ready('perfect', 40)) return;
      noise(0.018, 0.2, 'highpass', 4200);                     // sharp click
      const f = PENTA[Math.min(n - 1, PENTA.length - 1)];
      tone(f, 0.38, 'sine', 0.19, 0.004);                      // chime
      tone(f * 2, 0.2, 'sine', 0.045, 0.004);                  // shimmer
      if (n >= 3) tone(f * 1.5, 0.3, 'sine', 0.06, 0.06);      // harmony on bigger combos
    },
    fall() {
      if (!ready('fall', 120)) return;
      noise(0.26, 0.06, 'lowpass', 1400, 0.02, 260);
    },
    fail() {
      if (!ready('fail', 300)) return;
      tone(392, 0.18, 'triangle', 0.15, 0);
      tone(311.13, 0.2, 'triangle', 0.14, 0.13);
      tone(233.08, 0.42, 'triangle', 0.14, 0.27, 175);
    },
    heart() {
      if (!ready('heart', 250)) return;
      tone(64, 0.12, 'sine', 0.34);
      tone(54, 0.14, 'sine', 0.26, 0.15);
    },
    cool() {
      if (!ready('cool', 300)) return;
      noise(0.32, 0.07, 'highpass', 3200, 0, 1800);
    },
    win() {
      if (!ready('win', 500)) return;
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 0.3, 'sine', 0.16, i * 0.09));
      tone(1567.98, 0.5, 'sine', 0.05, 0.36);
    },
    ui() {                                                     // soft menu tick
      if (!ready('ui', 60)) return;
      tone(1320, 0.05, 'sine', 0.05);
    },
    unlock() {
      if (!ready('unlock', 400)) return;
      [783.99, 1046.5, 1318.51].forEach((f, i) => tone(f, 0.22, 'sine', 0.09, i * 0.07));
    }
  };
  function buzz(pattern) {
    if (!vibeOn || !canVibrate) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  }

  // ---------------------------------------------------------------
  // Effects: pooled particles and rings (no allocation while playing)
  // ---------------------------------------------------------------
  const MAX_P = 180;
  const pool = [];
  for (let i = 0; i < MAX_P; i++) pool.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, s: 1, g: 0, d: 0.985, k: 0, color: '#fff', cam: 0 });
  let pCursor = 0;
  function emit(x, y, vx, vy, life, s, color, g, d = 0.985, k = 0) {
    let p = null;
    for (let k = 0; k < MAX_P; k++) {
      const c = pool[(pCursor + k) % MAX_P];
      if (!c.on) { p = c; pCursor = (pCursor + k + 1) % MAX_P; break; }
    }
    if (!p) { p = pool[pCursor]; pCursor = (pCursor + 1) % MAX_P; }   // pool full: recycle
    p.on = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
    p.life = life; p.max = life; p.s = s; p.g = g; p.d = d; p.k = k; p.color = color; p.cam = camDown;
  }
  function sparkle(x, w, y, n, colors, power = 1) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
      const v = (1.2 + Math.random() * 2.6) * power;
      emit(x + Math.random() * w, y, Math.cos(a) * v, Math.sin(a) * v,
        28 + Math.random() * 26, 1.8 + Math.random() * 3, colors[i % colors.length], 0.16);
    }
  }
  // Perfect burst: outward from the block's top edge, 18-36 frames of life (0.3-0.6 s)
  function burst(x, w, y, n, colors, power) {
    const cx = x + w / 2;
    for (let i = 0; i < n; i++) {
      const px = x + Math.random() * w;
      const side = (px - cx) / Math.max(1, w / 2);
      const a = -Math.PI / 2 + side * 0.9 + (Math.random() - 0.5) * 0.9;
      const v = (2.2 + Math.random() * 3.2) * power;
      emit(px, y + Math.random() * 3, Math.cos(a) * v, Math.sin(a) * v,
        18 + Math.random() * 18, 1.6 + Math.random() * 2.4, colors[i % colors.length], 0.05, 0.9, 0);
    }
  }
  function sparks(x, w, y, n, color, power) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
      const v = (4 + Math.random() * 3) * power;
      emit(x + Math.random() * w, y, Math.cos(a) * v, Math.sin(a) * v, 14 + Math.random() * 10, 1.2, color, 0.08, 0.86, 1);
    }
  }
  function dust(x, w, y) {
    for (let i = 0; i < 4; i++) {
      const side = i < 2 ? -1 : 1;
      emit(side < 0 ? x : x + w, y + BH * 0.3, side * (0.3 + Math.random() * 0.8), -0.3 - Math.random() * 0.7,
        16 + Math.random() * 8, 1.2 + Math.random(), 'rgba(255,255,255,0.7)', 0.04);
    }
  }
  const MAX_R = 10;
  const rings = [];
  for (let i = 0; i < MAX_R; i++) rings.push({ on: false, x: 0, w: 0, row: 0, t: 0, max: 1, delay: 0, color: '#fff', lw: 2, grow: 16 });
  let rCursor = 0;
  function ring(x, w, row, color, delay, lw, grow, max = 26) {
    const r = rings[rCursor];
    rCursor = (rCursor + 1) % MAX_R;
    r.on = true; r.x = x; r.w = w; r.row = row; r.t = -delay; r.max = max; r.color = color; r.lw = lw; r.grow = grow;
  }
  const lavaGrad = ctx.createLinearGradient(0, 0, 0, 160);
  lavaGrad.addColorStop(0, 'rgba(251,146,60,0.78)');
  lavaGrad.addColorStop(0.25, 'rgba(234,88,12,0.82)');
  lavaGrad.addColorStop(1, 'rgba(127,29,29,0.94)');
  const glowSprite = document.createElement('canvas');
  glowSprite.width = glowSprite.height = 64;
  {
    const g = glowSprite.getContext('2d');
    const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    r.addColorStop(0, 'rgba(255,255,255,0.9)');
    r.addColorStop(0.35, 'rgba(255,255,255,0.32)');
    r.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = r;
    g.fillRect(0, 0, 64, 64);
  }
  const MAX_G = 2;
  const glows = [];
  for (let i = 0; i < MAX_G; i++) glows.push({ on: false, x: 0, w: 0, row: 0, t: 0, max: 1, str: 1 });
  let gCursor = 0;
  function glowFx(x, w, row, str, max = 16) {
    const g = glows[gCursor];
    gCursor = (gCursor + 1) % MAX_G;
    g.on = true; g.x = x; g.w = w; g.row = row; g.t = 0; g.max = max; g.str = Math.min(str, 1);
  }

  // Fly-bys: a small pool of sprites drifting past (birds, helicopters, balloons, planes, satellites)
  const MAX_FLY = 10;
  const flys = [];
  for (let i = 0; i < MAX_FLY; i++) flys.push({ on: false, type: '', x: 0, y0: 0, cam0: 0, f: 1, vx: 0, t: 0, k: 0 });
  let flyNext = 0, flyTimer = 240;
  const FLY_BY_ZONE = env => [
    ['birds'],
    env.low,
    ['balloon', 'birds', 'balloon'],
    ['plane', 'plane', 'balloon'],
    ['jet', 'wballoon', 'jet'],
    ['sat', 'sat', 'shoot'],
  ];
  function spawnFly(zone, fromAbove) {
    const H = canvas.height, W = canvas.width;
    const d = H / Math.max(1, innerHeight);
    const list = FLY_BY_ZONE(ENVS[envId])[zone];
    const type = list[Math.floor(Math.random() * list.length)];
    const o = flys.find(f => !f.on);
    if (!o) return;
    const dir = Math.random() < 0.5 ? 1 : -1;
    const sp = { birds: [0.5, 0.9], heli: [0.6, 1.0], balloon: [0.12, 0.28], plane: [1.4, 2.2], jet: [2.4, 3.4], wballoon: [0.05, 0.12], sat: [0.35, 0.65], shoot: [6, 9] }[type];
    o.on = true; o.type = type; o.t = 0; o.k = Math.floor(Math.random() * 2);
    o.vx = dir * (sp[0] + Math.random() * (sp[1] - sp[0])) * d;
    o.f = { birds: 0.85, heli: 0.9, balloon: 0.8, plane: 0.6, jet: 0.4, wballoon: 0.75, sat: 0.3, shoot: 0 }[type];
    o.cam0 = Math.round(camDown * scale);
    const slow = Math.abs(o.vx) < 0.3 * d;
    o.x = slow || fromAbove ? W * (0.08 + Math.random() * 0.84) : (dir > 0 ? -80 * d : W + 80 * d);
    o.y0 = fromAbove ? -60 * d - Math.random() * H * 0.25 : H * (0.1 + Math.random() * 0.42);
    if (type === 'shoot') { o.x = W * (0.1 + Math.random() * 0.6); o.y0 = H * (0.05 + Math.random() * 0.3); o.vx = Math.abs(o.vx); }
  }

  // ---------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------
  let mode = 'menu';       // 'menu', 'level', 'endless' or 'rising'
  let levelIdx = 0;
  let cfg = { ...DEFAULT_CFG };
  let stack = [];          // placed blocks: {x, w, c, sh, gold, t, amp, glow}; index 0 is the base
  let debris = [];         // cut-off pieces falling away (visual only, never collide)
  const MAX_DEBRIS = 14;
  let mx = 0, mw = 200, dir = -1;   // moving block: left x, width, direction
  let cur = { c: GOLD_C, sh: shades(GOLD_C), gold: false };
  let camDown = 0;         // how far the tower has scrolled down
  let camY = 0, camV = 0;  // camera impulse spring (visual only)
  let shake = 0;           // screen shake strength (game over)
  let flash = 0;           // restrained white flash (milestones / level complete)
  let wobT = 0;            // phase for the "speed changes" twist
  let time = 0;
  let running = false;
  let paused = false;
  let combo = 0;
  let perfects = 0;
  let msgTimer = 0;
  let lastScore = 0;
  let newBest = false;
  let failReason = 'miss';  // 'miss' or 'lava'
  let lava = RISE.start;    // lava surface height in rows
  let lavaClock = 0;        // seconds since the Rising run started
  let lavaFreeze = 0;       // frames left in a milestone pause
  let lavaFlash = 0;        // surface flash when a Perfect pushes it down
  let danger = 0;           // 0..1, how close the lava is
  let alt = 0;              // smoothed tower height in blocks (drives the environment)
  let meterPulse = 0;
  let runZone = 0;          // highest altitude zone reached this run
  let runBestCombo = 0;
  const sweep = { on: false, t: 0, row: 0, x: 0 };
  let beatTimer = 0, beatPulse = 0;
  let menuCam = 0;          // menu only: lifts the decorative tower into the gap above the Play button
  let lastT = performance.now();

  const score = () => stack.length - 1;
  const rowY = i => GROUND - (i + 1) * BH + camDown;
  const climbing = () => mode === 'endless' || mode === 'rising';

  function refreshInfo() {
    if (mode === 'level') infoEl.textContent = `Level ${levelIdx + 1} · ${score()}/${cfg.t}`;
    else if (mode === 'rising') infoEl.textContent = lavaFreeze > 0 ? '❄ Lava paused' : `${fmtAlt(altMeters(score()))}${bestRising > 0 ? ` · Best ${bestRising}` : ' · Outrun the lava'}`;
    else if (mode === 'endless') infoEl.textContent = `${fmtAlt(altMeters(score()))}${best > 0 ? ` · Best ${best}` : ''}`;
    else infoEl.textContent = '';
  }

  function makeBlock(x, w, c, gold) {
    return { x, w, c, sh: shades(c), gold, t: 999, amp: 0, glow: 0 };
  }

  function resetState() {
    const w = cfg.base;
    stack = [makeBlock((GW - w) / 2, w, colorFor(0), false)];
    debris = [];
    for (const p of pool) p.on = false;
    for (const r of rings) r.on = false;
    for (const g of glows) g.on = false;
    for (const f of flys) f.on = false;
    msgIsCombo = false;
    mw = w;
    combo = 0;
    perfects = 0;
    camDown = 0;
    camY = 0;
    camV = 0;
    shake = 0;
    flash = 0;
    wobT = 0;
    alt = 0;
    meterPulse = 0;
    runZone = 0;
    runBestCombo = 0;
    sweep.on = false;
    lava = RISE.start;
    lavaClock = 0;
    lavaFreeze = 0;
    lavaFlash = 0;
    danger = 0;
    beatTimer = 0;
    beatPulse = 0;
    failReason = 'miss';
    flyNext = canvas.height * 0.25;
    flyTimer = 120;
    zoneEl.classList.remove('on');
    dir = -1;
    spawn();
    scoreEl.textContent = '0';
    refreshInfo();
  }

  function spawn() {
    dir = -dir;
    mx = dir > 0 ? 0 : GW - mw;
    const gold = mode === 'level' && cfg.gold > 0 && stack.length % cfg.gold === 0;
    const c = gold ? GOLD_C : colorFor(stack.length);
    cur = { c, sh: shades(c), gold };
  }

  function begin() {
    ensureAudio();
    resetState();
    running = true;
    paused = false;
    msgEl.classList.remove('show');
    save.stats.games++;
    root('game');
  }

  function startLevel(i) {
    if (!levelOpen(i)) return;
    mode = 'level';
    levelIdx = i;
    cfg = { ...DEFAULT_CFG, ...LEVELS[i] };
    const w = WORLDS[worldOf(i)];
    skinNow = w.skin;
    setEnv(w.id);
    begin();
    const tw = twistLabel(cfg);
    showMsg(tw || `Stack ${cfg.t}`, 130);
  }

  function startEndless() {
    mode = 'endless';
    cfg = { ...DEFAULT_CFG };
    skinNow = save.skin;
    setEnv(save.world);
    begin();
  }

  function startRising() {
    if (!risingUnlocked()) return;
    mode = 'rising';
    cfg = { ...DEFAULT_CFG };
    skinNow = save.skin;
    setEnv(save.world);
    begin();
    showMsg('Outrun the lava!', 110);
  }

  function restart() {
    if (mode === 'level') startLevel(levelIdx);
    else if (mode === 'rising') startRising();
    else startEndless();
  }

  // tier 0 = info text; 1+ = combo strength (bigger and warmer)
  let msgIsCombo = false;
  function showMsg(t, dur = 60, tier = 0, isCombo = false) {
    const span = document.createElement('span');
    span.textContent = t;
    span.className = isCombo && !fxLow ? 'combo' : 'info';
    span.style.setProperty('--peak', (1.06 + Math.min(tier, 4) * 0.05).toFixed(2));
    msgIsCombo = isCombo;
    msgEl.replaceChildren(span);
    msgEl.style.color = tier >= 4 ? '#fb923c' : tier >= 3 ? '#fcd34d' : '#fde047';
    msgEl.style.fontSize = (20 + Math.min(tier, 4) * 1.5) + 'px';
    msgEl.classList.add('show');
    msgTimer = dur;
  }
  function showCombo(n) {
    const tier = n >= 5 ? 4 : n >= 3 ? 3 : n;
    showMsg(n > 1 ? `Perfect x${n}!` : 'Perfect!', 60, tier, true);
  }
  function clearCombo() {
    msgEl.classList.remove('show');
    msgTimer = 0;
    msgIsCombo = false;
  }
  function popScore(big) {
    scoreEl.classList.remove('pop', 'pop2');
    void scoreEl.offsetWidth;   // restart the CSS animation
    scoreEl.classList.add(big ? 'pop2' : 'pop');
  }
  let zoneTimer = 0;
  function showZone(z) {
    const Z = ZONES[z];
    const name = Z.name || ENVS[envId].lowName;
    zoneEl.innerHTML = `<b>${Z.icon} ${name}</b><small>${fmtAlt(altMeters(Z.at))}</small>`;
    zoneEl.classList.add('on');
    clearTimeout(zoneTimer);
    zoneTimer = setTimeout(() => zoneEl.classList.remove('on'), 2600);
  }

  function kick(v) { camV += v; }

  function addDebris(x, w, y, vx, va, sh) {
    if (w < 0.5) return;
    if (debris.length >= MAX_DEBRIS) debris.shift();   // cap: oldest piece is dropped
    const spin = va * (40 / (40 + w * 0.6));          // wider pieces turn more slowly
    debris.push({ x, w, y, vx, vy: 0, ang: 0, va: spin, age: 0, sh, cam: camDown });
  }

  function drop() {
    if (!running || paused) return;
    const top = stack[stack.length - 1];
    const row = stack.length;
    const left = Math.max(mx, top.x);
    const right = Math.min(mx + mw, top.x + top.w);
    const overlapW = right - left;
    const perfect = overlapW > 0 && Math.abs(mx - top.x) <= (cur.gold ? GOLD_TOL : PERFECT_TOL);

    // Missed completely, or a gold block that wasn't perfect: the whole block falls
    if (overlapW <= 0 || (cur.gold && !perfect)) {
      addDebris(mx, mw, rowY(row), dir * 1.2, dir * 0.035, cur.sh);
      if (cur.gold && overlapW > 0) showMsg('Gold needs a perfect!', 90);
      sfx.fail();
      buzz(160);
      fail();
      return;
    }

    let newX, newW, amp, glow = 0;
    if (perfect) {
      combo++;
      perfects++;
      newX = top.x;
      newW = top.w;
      amp = 0.14 + Math.min(combo, 6) * 0.015;
      glow = 1;
    } else {
      // Normal drop: chop off the overhang so it falls away (same cut as the original)
      combo = 0;
      newX = left;
      newW = overlapW;
      amp = 0.08;
      let cut = false;
      if (mx < left) { addDebris(mx, left - mx, rowY(row), -0.7, -0.035, cur.sh); cut = true; }
      if (mx + mw > right) { addDebris(right, mx + mw - right, rowY(row), 0.7, 0.035, cur.sh); cut = true; }
      if (cut) sfx.fall();
    }

    // Streak reward: after 3 perfects in a row the block gets a little wider
    if (combo >= 3) {
      newW = Math.min(cfg.base, newW + 4);
      newX = Math.max(0, Math.min(GW - newW, newX - 2));
    }

    top.t = 999;   // stop the old top block's settle so blocks never visually separate
    const nb = makeBlock(newX, newW, cur.c, cur.gold);
    nb.t = 0;
    nb.amp = amp;
    nb.glow = glow;
    stack.push(nb);
    mw = newW;
    const s = score();
    scoreEl.textContent = s;
    refreshInfo();
    save.stats.blocks++;
    if (perfect) save.stats.perfects++;
    runBestCombo = Math.max(runBestCombo, combo);
    // Height milestone: a quiet light sweep and a meter pulse (no sound, no message)
    if (s % CITY.milestoneEvery === 0 && !(mode === 'level' && s >= cfg.t)) {
      sweep.on = true;
      sweep.t = 0;
      sweep.row = row;
      sweep.x = newX + (newW + DX) / 2;
      meterPulse = 1;
    }
    // New altitude zone (Endless / Rising)
    if (climbing()) {
      const z = zoneAt(s);
      if (z > runZone) { runZone = z; if (z > 0) showZone(z); }
    }

    // Feedback
    const y = rowY(row);
    if (perfect) {
      const c = Math.min(combo, 10);                       // intensity stops growing after x10
      const milestone = combo === 3 || (combo >= 5 && combo % 5 === 0);
      const lite = fxLow ? 0.5 : 1;
      sfx.perfect(combo);
      buzz(milestone ? [18, 40, 30] : 12);
      burst(newX, newW, y, Math.round((12 + Math.min(combo - 1, 8)) * lite),
        [nb.sh.spark, '#ffffff', nb.sh.bright], 1 + (c - 1) * 0.06);
      ring(newX, newW, row, `rgba(255,255,255,${Math.min(0.75 + c * 0.04, 1).toFixed(2)})`, 0, 1.4 + Math.min(c, 5) * 0.25, 14 + c * 2);
      glowFx(newX, newW, row, 0.45 + Math.min(c, 6) * 0.08);
      if (combo >= 2) sparks(newX, newW, y, Math.round(Math.min(4 + combo * 2, 14) * lite), '#ffffff', 1 + (c - 2) * 0.05);
      if (combo >= 3) ring(newX, newW, row, nb.sh.bright, 4, 2.2, 26 + c * 2, 30);
      if (milestone) {
        burst(newX, newW, y, Math.round(8 * lite), ['#fde68a', '#fbbf24', '#ffffff'], 1.5);
        ring(newX, newW, row, 'rgba(253,230,138,0.9)', 8, 2.4, 44, 34);
        if (!fxLow) {
          kick(1.2 + c * 0.06);
          flash = Math.max(flash, 0.1);
        }
      }
      if (mode === 'rising') {
        lava = Math.max(RISE.start, lava - RISE.perfectPush);
        lavaFlash = 1;
        if (milestone) {
          lavaFreeze = RISE.freeze;
          sfx.cool();
          refreshInfo();
        }
      }
      showCombo(combo);
      popScore(combo >= 2);
    } else {
      sfx.tap();
      dust(newX, newW, y);
      popScore(false);
      if (msgIsCombo) clearCombo();                        // streak broken: retire the combo label
    }

    if (mode === 'level' && s >= cfg.t) {
      levelComplete();
      return;
    }
    spawn();
  }

  function stopPlay() {
    running = false;
    paused = false;
  }

  function endRunStats() {
    save.stats.bestCombo = Math.max(save.stats.bestCombo, runBestCombo);
    if (climbing()) save.stats.maxAlt = Math.max(save.stats.maxAlt, score());
  }

  function fail() {
    stopPlay();
    lastScore = score();
    newBest = false;
    if (mode === 'endless' && lastScore > best) {
      best = save.best = lastScore;
      newBest = true;
    }
    if (mode === 'rising' && lastScore > bestRising) {
      bestRising = save.bestRising = lastScore;
      newBest = true;
    }
    danger = 0;
    refreshInfo();
    if (msgIsCombo) clearCombo();
    shake = fxLow ? 0 : 14;
    endRunStats();
    const fresh = checkSkins();
    persist();
    const data = mode === 'level'
      ? { kind: 'failed', level: levelIdx, score: lastScore, target: cfg.t }
      : { kind: 'over', mode, score: lastScore, newBest, reason: failReason, zone: zoneAt(lastScore) };
    setTimeout(() => { showResult(data); announceSkins(fresh); }, 700);
  }

  function lavaCaught() {
    failReason = 'lava';
    sfx.fail();
    buzz([60, 40, 120]);
    fail();
  }

  function levelComplete() {
    stopPlay();
    const risingWasLocked = !risingUnlocked();
    const openBefore = WORLDS.map((_, w) => worldOpen(w));
    const ratio = perfects / cfg.t;
    const stars = ratio >= 0.3 ? 3 : ratio >= 0.15 ? 2 : 1;
    const prevStars = prog.stars[levelIdx] || 0;
    prog.stars[levelIdx] = Math.max(prevStars, stars);
    prog.unlocked = Math.max(prog.unlocked, Math.min(levelIdx + 2, LEVELS.length));
    const risingNew = risingWasLocked && risingUnlocked();
    const opened = WORLDS.map((_, w) => w).filter(w => !openBefore[w] && worldOpen(w));
    endRunStats();
    const fresh = checkSkins();
    persist();

    // Celebration: rings and sparkles on the top block, one camera impulse, restrained flash
    const row = stack.length - 1;
    const top = stack[row];
    const y = rowY(row);
    ring(top.x, top.w, row, 'rgba(255,255,255,0.95)', 0, 3, 30, 32);
    ring(top.x, top.w, row, 'rgba(253,230,138,0.9)', 8, 3, 54, 38);
    sparkle(top.x, top.w, y, 26, [top.sh.spark, '#ffffff', '#fde68a'], 1.6);
    sparkle(top.x, top.w, y, 16, ['#fbbf24', '#ffffff'], 2.1);
    if (!fxLow) {
      flash = 0.3;
      kick(2.2);
    }
    sfx.win();
    buzz([30, 40, 60]);
    const data = { kind: 'complete', level: levelIdx, stars, prevStars, perfects, target: cfg.t, risingNew, opened };
    setTimeout(() => {
      showResult(data);                                    // world / Rising unlocks are shown on the result card
      if (opened.length || risingNew) sfx.unlock();
      announceSkins(fresh);
    }, 900);
  }

  function announceSkins(fresh) {
    if (!fresh.length) return;
    fresh.forEach(s => toast(`New skin: ${s.name}`, 'palette'));
    sfx.unlock();
  }

  // ---------------------------------------------------------------
  // Screens and navigation
  // ---------------------------------------------------------------
  const SCREENS = ['menu', 'worlds', 'levels', 'skins', 'settings', 'stats', 'howto', 'pause', 'result'];

  const curScreen = () => (nav.length ? nav[nav.length - 1].name : 'menu');
  let resultData = null;
  let modalAction = null;
  let guarded = false;        // a history entry is pushed so Android back stays inside the game

  function ensureGuard() {
    if (guarded) return;
    try { history.pushState({ stackTower: 1 }, ''); guarded = true; } catch (e) {}
  }
  function paint() {
    const top = nav[nav.length - 1] || { name: 'menu' };
    const R = RENDER[top.name];
    if (R) R(top.arg);
    for (const s of SCREENS) $('scr-' + s).classList.toggle('on', s === top.name);
    const inGame = top.name === 'game' || top.name === 'pause';
    hudEl.classList.toggle('hidden', !inGame);
    pauseBtn.classList.toggle('show', top.name === 'game' && running);
    if (top.name !== 'game') zoneEl.classList.remove('on');
  }
  function go(name, arg) { nav.push({ name, arg }); paint(); ensureGuard(); }
  function root(name, arg) { nav.length = 0; nav.push({ name, arg }); paint(); if (name !== 'menu') ensureGuard(); }
  function pop() { if (nav.length > 1) { nav.pop(); paint(); } }

  function handleBack() {
    if (modalAction) { closeModal(); return; }
    switch (curScreen()) {
      case 'game': pauseGame(); break;
      case 'pause': resumeGame(); break;
      case 'result': resultBack(); break;
      case 'menu': toast('Press back again to exit'); break;
      default: pop();
    }
  }
  function resultBack() {
    if (resultData && resultData.kind !== 'over') openLevels(worldOf(resultData.level));
    else showMenu();
  }

  function showMenu() {
    stopPlay();
    mode = 'menu';
    cfg = { ...DEFAULT_CFG };
    if (!worldOpen(worldIdx(save.world))) save.world = 'city';
    skinNow = WORLDS[worldIdx(save.world)].skin;
    setEnv(save.world);
    resetState();
    // a small decorative tower, lifted into the open space between the title and the Play button
    for (let i = 1; i <= 4; i++) {
      const p = stack[i - 1];
      const w = Math.max(120, p.w - (i % 3 === 0 ? 10 : 0));
      const x = Math.max(0, Math.min(GW - w, p.x + (i % 2 ? 4 : -3)));
      stack.push(makeBlock(x, w, colorFor(i), false));
    }
    root('menu');
    const r = $('mPlay').getBoundingClientRect();
    const d = canvas.height / Math.max(1, innerHeight);
    menuCam = Math.min(0, ((r.top - 26) * d - oy) / scale - GROUND);
    camDown = menuCam;
  }
  function openLevels(w) {
    save.world = WORLDS[w].id;
    persist();
    if (mode === 'menu' || !running) { skinNow = WORLDS[w].skin; setEnv(WORLDS[w].id); }
    nav.length = 0;
    nav.push({ name: 'menu' }, { name: 'worlds' });
    go('levels', w);
  }

  function pauseGame() {
    if (!running || paused) return;
    paused = true;
    go('pause');
  }
  function resumeGame() {
    if (!paused) return;
    paused = false;
    while (nav.length > 1 && curScreen() !== 'game') nav.pop();
    paint();
    lastT = performance.now();
  }

  // --- toast + modal ---------------------------------------------------
  function toast(text, icon = 'star') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `${ICON[icon] || ''}<span></span>`;
    t.querySelector('span').textContent = text;
    $('toasts').appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 2600);
  }
  function confirmBox(title, text, okLabel, onOk, danger = false) {
    modalAction = onOk;

    m.innerHTML = `<div class="card mcard"><h3></h3><p></p>
      <div class="rrow"><button class="btn" data-act="m-cancel" id="mCancel">Cancel</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-act="m-ok" id="mOk"></button></div></div>`;
    m.querySelector('h3').textContent = title;
    m.querySelector('p').textContent = text;

  // Small stack of blocks in a skin, for the skins screen (reuses the real block renderer)
  function drawSkinPreview(cv, skin) {
    const g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    const k = cv.height / (BH * 4 + DY + 14);
    g.setTransform(k, 0, 0, k, cv.width / 2 - (110 * k) / 2 - DX * k / 2, 0);
    const widths = [110, 110, 104, 110], xs = [0, 0, 4, -2];
    for (let i = 0; i < 4; i++) {
      const c = colorForSkin(skin, i);
      const y = DY + 6 + (3 - i) * BH;
      drawBlock3D(xs[i], y, widths[i], shades(c), 1, 1, 0, false, g);
    }
  }

  async function share() {
    const text = mode === 'rising'
      ? `I climbed ${lastScore} blocks above the lava in Stack to Orbit! Can you beat me?`
      : `I stacked ${lastScore} blocks (${fmtAlt(altMeters(lastScore))}) in Stack to Orbit! Can you beat me?`;
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); toast('Score copied!', 'check'); }
    } catch (e) {}
  }

    if (top === 'settings' || top === 'pause') paint();
