    pendingStart = fn;
    go('howto', { then });
  }
  let pendingStart = null;

  function act(a, el) {
    switch (a) {
      case 'back': handleBack(); break;
      case 'pause': pauseGame(); break;
      case 'play': {
        const p = playTarget();
        if (p.open) withHowTo(() => startLevel(p.i), 'level');
        else { openLevels(worldOf(p.i) - 1); toast(p.label, 'star'); }
        break;
      }
      case 'levels': go('worlds'); break;
      case 'endless': withHowTo(startEndless, 'endless'); break;
      case 'rising':
        if (risingUnlocked()) withHowTo(startRising, 'rising');
        else toast(`Clear Level ${RISE.unlockAfterLevel} to unlock Rising`, 'lock');
        break;
      case 'skins': go('skins'); break;
      case 'stats': go('stats'); break;
      case 'settings': go('settings'); break;
      case 'howto': go('howto'); break;
      case 'howto-go': {
        save.seenHowTo = true;
        persist();
        const fn = pendingStart;
        pendingStart = null;
        if (fn) fn(); else pop();
        break;
      }
      case 'loc-prev': case 'loc-next': {
        const open = WORLDS.map((_, i) => i).filter(i => worldOpen(i));
        const k = open.indexOf(worldIdx(save.world));
        const n = open[(k + (a === 'loc-next' ? 1 : open.length - 1)) % open.length];
        save.world = WORLDS[n].id;
        persist();
        showMenu();
        break;
      }
      case 'world': {
        const w = +el.dataset.w;
        if (worldOpen(w)) openLevels(w);
        else toast(worldLockText(w), 'lock');
        break;
      }
      case 'level': {
        const i = +el.dataset.l;
        if (levelOpen(i)) withHowTo(() => startLevel(i), 'level');
        else toast(worldOpen(worldOf(i)) ? `Clear Level ${i} first` : worldLockText(worldOf(i)), 'lock');
        break;
      }
      case 'equip': {
        const id = el.dataset.s;
        if (!save.skins.includes(id)) { toast(SKIN_BY[id].req.text, 'lock'); break; }
        save.skin = id;
        persist();
        paint();
        toast(`${SKIN_BY[id].name} equipped`, 'check');
        break;
      }
      case 'tg-sound': setSetting('sound', !soundOn); if (soundOn) { ensureAudio(); sfx.ui(); } break;
      case 'tg-vibe': setSetting('vibe', !vibeOn); buzz(15); break;
      case 'tg-motion': setSetting('reducedFx', !fxLow); break;
      case 'tg-meter': setSetting('meter', !save.settings.meter); break;
      case 'q-sound': setSetting('sound', !soundOn); if (soundOn) { ensureAudio(); sfx.tap(); } break;
      case 'q-vibe': setSetting('vibe', !vibeOn); buzz(15); break;
      case 'q-motion': setSetting('reducedFx', !fxLow); break;
      case 'reset':
        confirmBox('Reset all progress?', 'Stars, unlocked levels and worlds, skins, best scores and stats will be erased. Settings stay as they are.', 'Reset', () => {
          const keep = save.settings;
          save = defaultSave();
          save.settings = keep;
          save.seenHowTo = true;
          prog = save.prog;
          best = 0; bestRising = 0;
          persist();
          toast('Progress reset', 'check');
          showMenu();
        }, true);
        break;
      case 'm-ok': { const f = modalAction; closeModal(); if (f) f(); break; }
      case 'm-cancel': closeModal(); break;
      case 'resume': resumeGame(); break;
      case 'restart': paused = false; restart(); break;
      case 'quit':
        confirmBox('Quit this run?', 'Your current tower will be lost.', 'Quit', () => { paused = false; endRunStats(); persist(); showMenu(); });
        break;
      case 'r-next': startLevel(resultData.level + 1); break;
      case 'r-retry': startLevel(resultData.level); break;
      case 'r-levels': openLevels(worldOf(resultData.level)); break;
      case 'r-endless': startEndless(); break;
      case 'r-again': if (resultData.mode === 'rising') startRising(); else startEndless(); break;
      case 'r-home': showMenu(); break;
      case 'r-share': share(); break;
    }
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  document.addEventListener('click', e => {
    const el = e.target instanceof Element ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    if (el.dataset.act !== 'pause') sfx.ui();
    act(el.dataset.act, el);
  });
  addEventListener('pointerdown', e => {
    ensureAudio();
    if (e.target instanceof Element && e.target.closest('button, .screen.on, #modal.on')) return;  // UI handles its own taps
    if (curScreen() !== 'game' || !running || paused) return;
    e.preventDefault();
    drop();
  });
  addEventListener('keydown', e => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (e.code === 'KeyP' && curScreen() !== 'game' && curScreen() !== 'pause') return;
      e.preventDefault();
      if (curScreen() !== 'menu') handleBack();
    } else if (e.code === 'Space' && curScreen() === 'game' && running && !paused) {
      e.preventDefault();
      drop();
    }
  });
  // Android back button (or browser back) walks back through the screens
  addEventListener('popstate', () => {
    guarded = false;
    handleBack();
    if (curScreen() !== 'menu' || modalAction) ensureGuard();
  });
  // Pause automatically when the app goes to the background
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

  // ---------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------
  function update(dt) {
    if (paused) return;
    time += dt;
    alt += (score() - alt) * Math.min(1, 0.06 * dt);
    meterPulse *= Math.pow(0.93, dt);
    if (sweep.on) { sweep.t += dt; if (sweep.t >= 42) sweep.on = false; }

    if (running) {
      let speed = mode === 'level'
        ? cfg.speed + Math.floor(score() / 5) * 0.12
        : Math.min(2.2 + Math.floor(score() / 10) * 0.4, 6.5);
      if (cfg.wobble) {
        wobT += 0.05 * dt;
        speed *= 1 + 0.55 * Math.sin(wobT);
      }
      mx += dir * speed * dt;
      if (mx < 0) { mx = 0; dir = 1; }
      if (mx + mw > GW) { mx = GW - mw; dir = -1; }

      if (mode === 'rising') {
        lavaClock += dt / 60;
        const wasFrozen = lavaFreeze > 0;
        if (lavaFreeze > 0) {
          lavaFreeze = Math.max(0, lavaFreeze - dt);
        } else if (lavaClock > RISE.delay) {
          const rate = Math.min(RISE.rate + (lavaClock - RISE.delay) * RISE.accel, RISE.maxRate);
          lava += rate * dt / 60;
        }
        if (wasFrozen !== (lavaFreeze > 0)) refreshInfo();
        const gap = stack.length - lava;                  // rows of tower still above the lava
        danger = lavaClock <= RISE.delay ? 0 : Math.max(0, Math.min(1, 1 - (gap - RISE.loseGap) / RISE.dangerRows));
        if (danger > 0.25) {
          beatTimer -= dt;
          if (beatTimer <= 0) {
            sfx.heart();
            beatPulse = 1;
            beatTimer = 60 * (1.0 - danger * 0.55);       // faster as it gets closer
          }
        } else {
          beatTimer = 0;
        }
        if (Math.random() < 0.25 * dt) {                  // embers drifting up from the surface
          emit(Math.random() * (GW + DX), GROUND - lava * BH + camDown, (Math.random() - 0.5) * 0.4, -0.5 - Math.random() * 0.8,
            30 + Math.random() * 20, 1.4 + Math.random() * 1.6, Math.random() < 0.5 ? '#fdba74' : '#fb923c', -0.004, 0.99, 0);
        }
        if (gap <= RISE.loseGap) { lavaCaught(); return; }
      }
    }
    beatPulse *= Math.pow(0.88, dt);
    lavaFlash *= Math.pow(0.88, dt);

    // Scroll the camera once the tower gets tall
    const camTarget = mode === 'menu' ? menuCam : Math.max(0, stack.length - 11) * BH;
    camDown += (camTarget - camDown) * Math.min(1, 0.12 * dt);

    // Camera impulse spring: small push that settles in under 0.5 s
    camV += -camY * 0.28 * dt;
    camV *= Math.pow(0.66, dt);
    camY += camV * dt;
    if (Math.abs(camY) < 0.01 && Math.abs(camV) < 0.01) { camY = 0; camV = 0; }

    for (let i = Math.max(0, stack.length - 3); i < stack.length; i++) {
      const b = stack[i];
      if (b.t < 999) b.t += dt;
      if (b.glow > 0) { b.glow *= Math.pow(0.86, dt); if (b.glow < 0.01) b.glow = 0; }
    }

    for (const d of debris) {
      d.vy += 0.45 * dt;
      d.vx *= Math.pow(0.995, dt);
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.ang += d.va * Math.min(1, d.age / 10) * dt;
      d.age += dt;
    }
    debris = debris.filter(d => d.age < 60 && d.y < GH + 100);

    for (const p of pool) {
      if (!p.on) continue;
      p.vy += p.g * dt;
      const drag = Math.pow(p.d, dt);
      p.vx *= drag;
      p.vy *= drag;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) p.on = false;
    }
    for (const r of rings) { if (r.on) { r.t += dt; if (r.t >= r.max) r.on = false; } }
    for (const g of glows) { if (g.on) { g.t += dt; if (g.t >= g.max) g.on = false; } }

    // Fly-bys: new ones arrive from above as the tower climbs, a few cross the sky over time
    const W = canvas.width, H = canvas.height;
    const camPx = Math.round(camDown * scale);
    const zone = zoneAt(alt);
    if (camPx >= flyNext) {
      spawnFly(zone, true);
      flyNext = camPx + H * (0.22 + Math.random() * 0.33);   // something passes every few blocks
    }
    flyTimer -= dt;
    if (flyTimer <= 0) {
      if (flys.filter(f => f.on).length < 3) spawnFly(zone, false);
      flyTimer = 60 * (4 + Math.random() * 6);
    }
    for (const f of flys) {
      if (!f.on) continue;
      f.t += dt;
      f.x += f.vx * dt;
      const y = f.y0 + (camPx - f.cam0) * f.f;
      if (f.x < -200 * scale || f.x > W + 200 * scale || y > H + 120 || (f.type === 'shoot' && f.t > 40)) f.on = false;
    }

    shake *= Math.pow(0.88, dt);
    if (shake < 0.1) shake = 0;
    flash *= Math.pow(0.9, dt);
    if (flash < 0.01) flash = 0;

    if (msgTimer > 0) {
      msgTimer -= dt;
      if (msgTimer <= 0) msgEl.classList.remove('show');
    }
  }

  // ---------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------
  function topPath(g, w) {
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(w, 0); g.lineTo(w + DX, -DY); g.lineTo(DX, -DY);
    g.closePath();
  }
  // One block in oblique 3D. Local origin = top-left of the front face (the gameplay rectangle).
  // sx/sy squash around the bottom-centre for the settle animation (visual only).
  function drawBlock3D(x, y, w, sh, sx = 1, sy = 1, glow = 0, gold = false, g = ctx) {
    g.save();
    if (sx !== 1 || sy !== 1) {
      g.translate(x + w / 2, y + BH);
      g.scale(sx, sy);
      g.translate(-w / 2, -BH);
    } else {
      g.translate(x, y);
    }
    g.fillStyle = sh.side;                                  // right side face: away from the light
    g.beginPath();
    g.moveTo(w, 0); g.lineTo(w + DX, -DY); g.lineTo(w + DX, BH - DY); g.lineTo(w, BH);
    g.closePath();
    g.fill();
    g.fillStyle = sh.top;                                   // top face: brightest
    topPath(g, w);
    g.fill();
    g.fillStyle = sh.front;
    g.fillRect(0, 0, w, BH);
    if (sh.mat === 'sand') {                                // matte stone with strata
      g.fillStyle = sh.edge;
      g.fillRect(0, 0, w, 1);
      g.fillStyle = sh.strata;
      g.fillRect(0, BH * 0.36, w, 1);
      g.fillRect(0, BH * 0.7, w, 1);
      g.fillStyle = sh.strata2;
      g.fillRect(0, BH * 0.36 + 1, w, 1);
      g.fillRect(0, BH * 0.7 + 1, w, 1);
      g.fillStyle = 'rgba(0,0,0,0.18)';
      g.fillRect(0, BH - 1.5, w, 1.5);
    } else if (sh.mat === 'ice') {                          // translucent, frosted edges, a glint
      g.fillStyle = sh.glint;
      const gx = Math.min(w * 0.18, 30);
      g.beginPath();
      g.moveTo(gx, 0); g.lineTo(gx + 9, 0); g.lineTo(gx + 9 - BH * 0.45, BH); g.lineTo(gx - BH * 0.45, BH);
      g.closePath();
      g.fill();
      g.fillStyle = sh.edge;
      g.fillRect(0, 0, w, 1.3);
      g.fillStyle = sh.frost;
      g.fillRect(0, 1.3, 1.4, BH - 1.3);
      g.fillRect(0, BH - 1.2, w, 1.2);
    } else if (sh.mat === 'neon') {                         // dark glass with a glowing outline
      g.strokeStyle = sh.glowLine;
      g.lineWidth = 3.2;
      g.strokeRect(1, 1, w - 2, BH - 2);
      g.strokeStyle = sh.edge;
      g.lineWidth = 1.2;
      g.strokeRect(0.6, 0.6, w - 1.2, BH - 1.2);
      topPath(g, w);
      g.lineWidth = 1;
      g.stroke();
      g.fillStyle = sh.inner;
      g.fillRect(3, BH * 0.5, w - 6, 1);
    } else {                                                // gloss: thin chamfer highlights
      g.fillStyle = sh.edge;
      g.fillRect(0, 0, w, 1.2);
      g.fillStyle = 'rgba(255,255,255,0.13)';
      g.fillRect(0, 1.2, 1.2, BH - 1.2);
      g.fillStyle = 'rgba(255,255,255,0.09)';
      g.fillRect(w - 1, 0, 1, BH);
      g.fillStyle = 'rgba(0,0,0,0.2)';
      g.fillRect(0, BH - 1.5, w, 1.5);
    }
    if (gold) {
      g.strokeStyle = 'rgba(255,255,255,0.8)';
      g.lineWidth = 1.3;
      g.strokeRect(0.65, 0.65, w - 1.3, BH - 1.3);
    }
    if (glow > 0) {
      g.fillStyle = `rgba(255,255,255,${glow * 0.5})`;
      g.fillRect(0, 0, w, BH);
      topPath(g, w);
      g.fill();
    }
    g.restore();
  }

  function drawPlaced(b, y) {
    let sx = 1, sy = 1;
    if (b.t < 45 && b.amp) {                               // squash-and-settle, visual only
      const s = b.amp * Math.exp(-b.t / 7) * Math.cos(b.t * 0.55);
      sy = 1 - s;
      sx = 1 + s * 0.35;
    }
    drawBlock3D(b.x, y, b.w, b.sh, sx, sy, b.glow, b.gold);
  }

  // Fake soft shadow on the exposed ledge of the lower block's top face (no real-time shadows)
  function castShadow(lower, y, ux, uw) {
    const xr = ux + uw;
    const room = lower.x + lower.w - xr;
    if (room <= 0.5 || xr < lower.x) return;
    const strip = (s, color) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(xr, y); ctx.lineTo(xr + s, y); ctx.lineTo(xr + s + DX, y - DY); ctx.lineTo(xr + DX, y - DY);
      ctx.closePath();
      ctx.fill();
    };
    strip(Math.min(8, room), lower.sh.shadowSoft);
    strip(Math.min(3, room), lower.sh.shadowHard);
  }

  function meterMarks() {
    if (mode === 'level') return { max: cfg.t, marks: [{ at: cfg.t, icon: '🏁' }] };
    return { max: CITY.meterMax, marks: ZONES.slice(1).map(z => ({ at: z.at, icon: z.icon })) };
  }
  function drawMeter(W, H) {
    const d = H / Math.max(1, innerHeight);
    const x = 9 * d, y0 = H * 0.76, y1 = H * 0.26;
    const { max, marks } = meterMarks();
    const yAt = v => y0 + (y1 - y0) * Math.min(1, v / max);
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.fillRect(x - d, y1, 2 * d, y0 - y1);
    ctx.font = `${Math.round(11 * d)}px system-ui, sans-serif`;
    ctx.textBaseline = 'middle';
    for (const m of marks) {
      const my = yAt(m.at);
      const passed = alt >= m.at;
      ctx.fillStyle = passed ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.22)';
      ctx.fillRect(x - 3 * d, my - 0.5 * d, 6 * d, d);
      ctx.globalAlpha = passed ? 0.85 : 0.4;
      ctx.fillText(m.icon, x + 5 * d, my);
      ctx.globalAlpha = 1;
    }
    const py = yAt(alt);
    if (meterPulse > 0.02) {
      ctx.fillStyle = `rgba(253,230,138,${(meterPulse * 0.45).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, py, (4 + meterPulse * 7) * d, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(x, py, 3.2 * d, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFlys(W, H, camPx) {
    const d = H / Math.max(1, innerHeight);
    for (const f of flys) {
      if (!f.on) continue;
      const y = f.y0 + (camPx - f.cam0) * f.f;
      if (f.type === 'shoot') {                            // shooting star
        const p = f.t / 40, a = (1 - p) * 0.9;
        const hx = f.x, hy = y + f.t * 2.2 * d;
        ctx.strokeStyle = `rgba(255,255,255,${a.toFixed(3)})`;
        ctx.lineWidth = 1.4 * d;
        ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - 60 * d, hy - 22 * d); ctx.stroke();
        continue;
      }
      let s = spr[f.type];
      if (Array.isArray(s)) s = f.type === 'birds' ? s[Math.floor(f.t / 9) % 2] : s[f.k % s.length];
      if (!s) continue;
      const bob = (f.type === 'balloon' || f.type === 'wballoon') ? Math.sin(f.t * 0.03) * 3 * d : 0;
      if (f.type === 'plane' || f.type === 'jet') {        // contrail
        const len = (f.type === 'jet' ? 220 : 120) * d;
        const tx = f.vx > 0 ? f.x : f.x + s.width, ty = y + s.height * 0.45;
        for (let k = 0; k < 3; k++) {
          ctx.fillStyle = `rgba(255,255,255,${(0.16 - k * 0.05).toFixed(3)})`;
          ctx.fillRect(f.vx > 0 ? tx - len * (k + 1) / 3 : tx + len * k / 3, ty, len / 3, 1.6 * d);
        }
      }
      ctx.save();
      if (f.vx < 0 && f.type !== 'balloon' && f.type !== 'wballoon') {
        ctx.translate(Math.round(f.x) + s.width, Math.round(y + bob));
        ctx.scale(-1, 1);
        ctx.drawImage(s, 0, 0);
      } else {
        ctx.drawImage(s, Math.round(f.x), Math.round(y + bob));
      }
      ctx.restore();
      if ((f.type === 'heli' || f.type === 'plane' || f.type === 'sat') && Math.floor(f.t / 20) % 2 === 0) {
        ctx.fillStyle = f.type === 'sat' ? 'rgba(255,255,255,0.9)' : 'rgba(255,80,80,0.95)';
        const lx = f.vx > 0 ? f.x + s.width * 0.55 : f.x + s.width * 0.45;
        ctx.fillRect(lx, y + s.height * (f.type === 'sat' ? 0.05 : 0.2), 2.2 * d, 2.2 * d);
      }
    }
  }

  function render() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const W = canvas.width, H = canvas.height;

    // Background: rebuilt into a cache once the camera has been still for two frames
    const camPx = Math.round(camDown * scale);
    const sky = skyLevel(alt);
    const hazeA = (0.15 + 0.7 * smooth(CITY.hazeFrom, CITY.hazeTo, alt)) * (1 - smooth(60, 75, alt));
    const key = camPx + '|' + Math.round(sky * 100) + '|' + Math.round(hazeA * 100);
    if (sceneValid && key === sceneKey) {
      ctx.drawImage(sceneCanvas, 0, 0);
    } else if (key === lastSceneKey) {
      paintScene(sceneCtx, camPx, sky, hazeA);
      sceneKey = key;
      sceneValid = true;
      ctx.drawImage(sceneCanvas, 0, 0);
    } else {
      paintScene(ctx, camPx, sky, hazeA);
    }
    lastSceneKey = key;

    for (const tw of twinkles) {                           // window twinkles / sign flicker
      const L = cityLayers[tw.li];
      const y = Math.round(oy + (GROUND - L.lift) * scale + camPx * L.f) - L.lh + tw.y;
      if (y > H || y < -tw.h) continue;
      ctx.globalAlpha = 0.45 * (0.5 + 0.5 * Math.sin(time * tw.sp + tw.ph));
      ctx.fillStyle = tw.c;
      ctx.fillRect(tw.x, y, tw.w, tw.h);
    }
    ctx.globalAlpha = 1;

    const moonT = smooth(80, 92, alt);                     // the moon grows as you climb through space
    if (moonT > 0.01 && spr.moon) {
      const r = H * (0.035 + 0.07 * smooth(85, 170, alt));
      const s = spr.moon, k = r / ((s.width - 4) / 2);
      ctx.globalAlpha = moonT;
      ctx.drawImage(s, W * 0.76 - (s.width * k) / 2, H * 0.2 - (s.height * k) / 2, s.width * k, s.height * k);
      ctx.globalAlpha = 1;
    }

    const cloudT = smooth(CITY.cloudFrom, CITY.cloudTo, alt) * (1 - smooth(56, 66, alt));
    if (cloudT > 0.01) {
      for (const cl of clouds) {
        const sp = cloudSprites[cl.sp];
        const cw = sp.width, ch = sp.height;
        const span = H + ch * 2 + 40;
        const y = ((cl.y0 + camPx * cl.f) % span) - ch - 20;
        let x = cl.x + time * cl.v;
        x = ((x + cw) % (W + cw * 2) + (W + cw * 2)) % (W + cw * 2) - cw;
        ctx.globalAlpha = cloudT * cl.a;
        ctx.drawImage(sp, Math.round(x), Math.round(y));
      }
      ctx.globalAlpha = 1;
    }

    drawFlys(W, H, camPx);

    if ((running || paused) && save.settings.meter) drawMeter(W, H);

    // Ambient particles: dust, sand, snow or neon bokeh
    const amb = ENVS[envId].ambient;
    const dpx = H / Math.max(1, innerHeight);
    for (const m of motes) {
      let xx = m.x * W, yy;
      if (amb === 'snow') {
        yy = ((m.y * H + time * 0.5 * m.s * dpx + camDown * scale * 0.2 * m.s) % H + H) % H;
        xx += Math.sin(time * 0.02 + m.p) * 6 * dpx;
        ctx.fillStyle = `rgba(255,255,255,${(m.a * 1.6).toFixed(3)})`;
      } else if (amb === 'sand') {
        yy = ((m.y * H + camDown * scale * 0.12 * m.s) % H + H) % H;
        xx = ((m.x * W + time * 0.35 * m.s * dpx) % W + W) % W;
        ctx.fillStyle = `rgba(255,226,190,${(m.a * 0.9).toFixed(3)})`;
      } else if (amb === 'bokeh') {
        yy = ((m.y * H - time * 0.18 * m.s * dpx + camDown * scale * 0.12 * m.s) % H + H) % H;
        ctx.fillStyle = m.p > 3.14 ? `rgba(236,72,153,${m.a.toFixed(3)})` : `rgba(34,211,238,${m.a.toFixed(3)})`;
      } else {
        yy = ((m.y * H + camDown * scale * 0.12 * m.s) % H + H) % H;
        ctx.fillStyle = `rgba(255,255,255,${(m.a * (0.7 + 0.3 * Math.sin(time * 0.02 + m.p))).toFixed(3)})`;
      }
      const sz = m.s * scale * (amb === 'bokeh' ? 1.6 : amb === 'snow' ? 1.2 : 0.9);
      ctx.fillRect(xx, yy, sz, sz);
    }

    const sx = shake ? (Math.random() * 2 - 1) * shake : 0;
    const sy = shake ? (Math.random() * 2 - 1) * shake : 0;
    ctx.setTransform(scale, 0, 0, scale, ox + sx * scale, oy + (sy + camY) * scale);

    // Ground the tower stands on: spans the whole screen width, scrolls with the world
    const wl = -(ox + sx * scale) / scale - 2, wr = (W - ox - sx * scale) / scale + 2;
    const fy = GROUND + camDown - DY - 3;
    const fb = (H - oy) / scale - (sy + camY) + 4;
    const ground = ENVS[envId].ground;
    if (fy < fb) {
      ctx.save();
      ctx.translate(0, fy);
      ctx.fillStyle = floorGrad;
      ctx.fillRect(wl, 0, wr - wl, fb - fy);
      ctx.restore();
      ctx.fillStyle = ground.edge;
      ctx.fillRect(wl, fy, wr - wl, 1);
      if (ground.water) {                                  // harbour water: shimmering light lines and a platform
        for (let k = 0; k < 7; k++) {
          const ly = fy + 8 + k * 9;
          if (ly > fb) break;
          const a = 0.1 + 0.08 * Math.sin(time * 0.05 + k * 1.7);
          ctx.fillStyle = k % 2 ? `rgba(34,211,238,${a.toFixed(3)})` : `rgba(236,72,153,${a.toFixed(3)})`;
          const off = Math.sin(time * 0.02 + k) * 20;
          ctx.fillRect(wl + 30 + off + k * 23 % 60, ly, (wr - wl) * 0.35, 1.2);
          ctx.fillRect(wl + (wr - wl) * 0.55 - off, ly + 3, (wr - wl) * 0.3, 1.2);
        }
        const pw = stack[0].w + 50, px = GW / 2 - pw / 2;
        ctx.fillStyle = 'rgba(20,8,36,0.95)';
        ctx.fillRect(px, GROUND + camDown - 2, pw + DX, 10);
        ctx.fillStyle = 'rgba(236,72,153,0.8)';
        ctx.fillRect(px, GROUND + camDown - 2, pw + DX, 1.2);
      } else if (envId === 'desert') {
        ctx.fillStyle = 'rgba(255,230,190,0.12)';
        for (let k = 1; k < 5; k++) ctx.fillRect(wl, fy + k * 11 + (k % 2) * 3, wr - wl, 1);
      }
    }

    const gy = GROUND + camDown;                            // ground shadow under the base
    if (gy < GH + 30) {
      const bw = stack[0].w;
      const cx = GW / 2 + DX / 2 + 4;
      ctx.fillStyle = envId === 'snow' ? 'rgba(30,60,100,0.2)' : 'rgba(0,0,0,0.16)';
      ctx.beginPath();
      ctx.ellipse(cx + 6, gy - DY / 2 + 3, bw / 2 + 34, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = envId === 'snow' ? 'rgba(30,60,100,0.28)' : 'rgba(0,0,0,0.24)';
      ctx.beginPath();
      ctx.ellipse(cx, gy - DY / 2 + 1, bw / 2 + 10, 5 + DY / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    if (mode === 'level' && cfg.t > 0) {                   // target line for the current level
      const ty = rowY(cfg.t) + BH - 3;
      if (ty > -10 && ty < GH) {
        ctx.fillStyle = 'rgba(250,204,21,.6)';
        for (let x = 0; x < GW + DX; x += 16) ctx.fillRect(x, ty, 9, 2);
      }
    }

    // Tower, bottom to top; the block resting on each one casts a soft shadow on its ledge
    const n = stack.length;
    for (let i = 0; i < n; i++) {
      const y = rowY(i);
      if (y < -BH * 2 || y > GH + DY) continue;
      drawPlaced(stack[i], y);
      const above = i + 1 < n ? stack[i + 1] : (running ? { x: mx, w: mw } : null);
      if (above) castShadow(stack[i], y, above.x, above.w);
    }

    if (running) {
      const top = stack[n - 1];
      const ty = rowY(n - 1);
      const left = Math.max(mx, top.x);                    // landing zone highlight
      const right = Math.min(mx + mw, top.x + top.w);
      if (right > left) {
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.fillRect(left, ty, right - left, BH);
      }
      drawBlock3D(mx, rowY(n), mw, cur.sh, 1, 1, 0, cur.gold);
    }

    for (const d of debris) {                              // cut-off pieces
      const a = d.age < 22 ? 1 : Math.max(0, 1 - (d.age - 22) / 38);
      if (a <= 0) continue;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(d.x + d.w / 2, d.y + BH / 2 + (camDown - d.cam));
      ctx.rotate(d.ang);
      drawBlock3D(-d.w / 2, -BH / 2, d.w, d.sh);
      ctx.restore();
    }

    if (mode === 'rising') {                               // lava
      const ly = GROUND - lava * BH + camDown;
      const depth = GH + 400 - ly;
      if (depth > 0) {
        const wave = x => Math.sin(x * 0.05 + time * 0.08) * 2.2 + Math.sin(x * 0.11 - time * 0.05) * 1.2;
        const x0 = wl - 10, x1 = wr + 10, steps = 20;
        ctx.save();
        ctx.translate(0, ly);
        ctx.beginPath();
        ctx.moveTo(x0, depth);
        for (let i = 0; i <= steps; i++) {
          const x = x0 + (x1 - x0) * i / steps;
          ctx.lineTo(x, wave(x));
        }
        ctx.lineTo(x1, depth);
        ctx.closePath();
        ctx.fillStyle = lavaGrad;
        ctx.fill();
        if (lavaFreeze > 0) {
          ctx.fillStyle = `rgba(120,170,255,${0.32 * Math.min(1, lavaFreeze / 20)})`;
          ctx.fill();
        }
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
          const x = x0 + (x1 - x0) * i / steps;
          if (i === 0) ctx.moveTo(x, wave(x)); else ctx.lineTo(x, wave(x));
        }
        ctx.strokeStyle = lavaFreeze > 0 ? 'rgba(191,219,254,0.9)' : `rgba(254,215,170,${0.75 + lavaFlash * 0.25})`;
        ctx.lineWidth = 2 + lavaFlash * 2;
        ctx.stroke();
        ctx.restore();
      }
    }

    if (sweep.on) {                                        // height milestone sweep
      const p = sweep.t / 42;
      const e = 1 - Math.pow(1 - p, 3);
      const ly = rowY(sweep.row) - DY;
      const reach = (wr - wl) * 0.55 * e;
      const a = (1 - p) * (1 - p);
      ctx.fillStyle = `rgba(255,255,255,${(a * 0.22).toFixed(3)})`;
      ctx.fillRect(sweep.x - reach, ly - 1.5, reach * 2, 3);
      ctx.fillStyle = `rgba(255,255,255,${(a * 0.6).toFixed(3)})`;
      ctx.fillRect(sweep.x - reach * 0.7, ly - 0.5, reach * 1.4, 1);
    }

    for (const r of rings) {                               // expanding rings around perfect blocks
      if (!r.on || r.t < 0) continue;
      const p = r.t / r.max;
      const e = 1 - Math.pow(1 - p, 3);
      const pad = e * r.grow;
      ctx.globalAlpha = (1 - p) * 0.9;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.lw * (1 - p * 0.6);
      ctx.strokeRect(r.x - pad, rowY(r.row) - DY - pad, r.w + DX + pad * 2, BH + DY + pad * 2);
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';              // brief glow at the placement
    for (const g of glows) {
      if (!g.on) continue;
      const p = g.t / g.max;
      const a = g.str * (1 - p) * (1 - p);
      if (a <= 0.01) continue;
      const gw = g.w + DX + 40, gh = 52 * (1 + p * 0.3);
      ctx.globalAlpha = a;
      ctx.drawImage(glowSprite, g.x + (g.w + DX) / 2 - gw / 2, rowY(g.row) + (BH - DY) / 2 - gh / 2, gw, gh);
    }
    ctx.globalCompositeOperation = 'source-over';

    let anySpark = false;                                  // particles
    for (const p of pool) {
      if (!p.on) continue;
      if (p.k === 1) { anySpark = true; continue; }
      const k = p.life / p.max;
      const s = p.s * (0.4 + 0.6 * k);
      ctx.globalAlpha = k * k * (3 - 2 * k);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - s / 2, p.y + (camDown - p.cam) - s / 2, s, s);
    }
    if (anySpark) {                                        // sparks, batched into 4 fade levels
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.1;
      for (let lvl = 0; lvl < 4; lvl++) {
        ctx.beginPath();
        let cnt = 0;
        for (const p of pool) {
          if (!p.on || p.k !== 1) continue;
          const k = p.life / p.max;
          if (Math.min(3, Math.floor(k * 4)) !== lvl) continue;
          const py = p.y + (camDown - p.cam);
          ctx.moveTo(p.x, py);
          ctx.lineTo(p.x - p.vx * 2, py - p.vy * 2);
          cnt++;
        }
        if (cnt) { ctx.globalAlpha = (lvl + 0.5) / 4; ctx.stroke(); }
      }
    }
    ctx.globalAlpha = 1;

    // Near clouds pass in front of the tower, faster than the camera, fading around the moving block
    const fgT = smooth(28, 34, alt) * (1 - smooth(50, 58, alt));
    if (fgT > 0.01) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const blockY = oy + (rowY(stack.length) + BH / 2) * scale;
      for (const cl of fgClouds) {
        const sp = fgSprites[cl.sp];
        const span = H + sp.height * 2;
        const y = ((cl.y0 + camPx * cl.f) % span) - sp.height;
        let x = cl.x + time * cl.v;
        x = ((x + sp.width) % (W + sp.width * 2) + (W + sp.width * 2)) % (W + sp.width * 2) - sp.width;
        const near = Math.min(1, Math.abs(y + sp.height / 2 - blockY) / (H * 0.14));
        ctx.globalAlpha = fgT * cl.a * (0.25 + 0.75 * near);
        ctx.drawImage(sp, Math.round(x), Math.round(y));
      }
      ctx.globalAlpha = 1;
    }

    if (mode === 'rising' && danger > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = Math.min(1, danger * 0.5 + beatPulse * danger * (fxLow ? 0 : 0.2));
      ctx.drawImage(dangerCanvas, 0, 0);
      ctx.globalAlpha = 1;
    }
    if (flash > 0) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = `rgba(255,255,255,${flash})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  // Loop
  function frame(now) {
    const dt = Math.min(3, (now - lastT) / (1000 / 60));
    lastT = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  pauseBtn.innerHTML = ICON.pause;
  addEventListener('resize', () => { resize(); if (curScreen() === 'menu') showMenu(); else if (curScreen() === 'skins') paint(); });
  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
